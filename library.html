<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7fc">
    <title>Thư viện Prompt - Trợ lý AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <style>
        html { background-color: #f8f7fc; transition: background-color .15s ease; min-height: 100vh; }
        html.dark { background-color: #0f172a; }
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background-color .15s ease, color .15s ease; background-color: #f8f7fc; overscroll-behavior-y: none; }
        .dark body { background-color: #0f172a; }
        .app-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-color: rgba(0,0,0,.06); }
        .dark .app-header { background: rgba(15, 23, 42, 0.85); border-color: rgba(255,255,255,.1); }
        .brand-text { background: linear-gradient(100deg, #ec4899, #a052c8 52%, #3979f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .menu-dropdown { transition: all .2s ease-in-out; transform-origin: top left; width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 100px); overflow-y: auto; }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: all .2s ease; }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }
        .glass-card { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
        .toast-msg { background-color: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,.1); opacity: 0; transform: translateY(20px); transition: all .3s ease; pointer-events: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .toast-success { border-left: 4px solid #22c55e; }
        .toast-error { border-left: 4px solid #ef4444; }
        .toast-show { opacity: 1; transform: translateY(0); }
    </style>
</head>

<body class="antialiased min-h-screen relative text-slate-800 dark:text-slate-100 flex flex-col">
    <div id="menuOverlay" class="menu-overlay"></div>

    <!-- HEADER -->
    <header class="app-header fixed top-0 left-0 w-full z-50 border-b">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-between gap-2 sm:gap-3 relative">
            <div class="relative flex items-center gap-1 sm:gap-2 z-50">
                <button id="btnHamburger" class="w-10 h-10 shrink-0 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div id="dropdownMenu" class="menu-dropdown absolute top-12 left-0 bg-white/95 dark:bg-[#1e293b]/95 backdrop-blur-xl border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl hidden opacity-0 scale-95 z-50 p-2">
                    <div class="flex flex-col gap-1">
                        <a href="./index.html" class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">Trang chủ</a>
                        <a href="./landing.html" class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">Đánh giá</a>
                        <a href="./library.html" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">Thư viện</a>
                        <div class="h-px bg-slate-200 dark:bg-slate-700/50 my-1 mx-2"></div>
                        <button id="themeToggleMenu" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors text-left">
                            <span id="themeIconMenu" class="w-5 h-5 flex items-center justify-center shrink-0"></span><span id="themeTextMenu">Chế độ Tối</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-1.5 min-w-0">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7 shrink-0" viewBox="0 0 24 24"><defs><linearGradient id="brandSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><path fill="url(#brandSparkGradient)" d="M12 2L14.7 9.3 22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></svg>
                    <span class="brand-text text-base sm:text-lg font-extrabold truncate">Trợ lý AI</span>
                </div>
            </div>
            <a href="./landing.html" class="px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-bold text-white bg-gradient-to-r from-pink-500 to-blue-500 shadow-sm hover:scale-105 transition-all z-50">Trải nghiệm ngay</a>
        </div>
    </header>

    <main class="w-full max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 md:pt-28 pb-32 flex-grow flex flex-col mt-4">
        <div class="glass-card bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700/60 shadow-xl rounded-3xl p-6">
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-200 mb-2 flex items-center gap-2"><span>📚</span> Thư viện Prompt</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Những câu lệnh đạt điểm 8.0 trở lên. Bấm "Copy" để sử dụng ngay.</p>
            <div id="libraryLoading" class="text-center py-10 text-slate-500 text-sm animate-pulse">Đang tải dữ liệu...</div>
            <div id="libraryList" class="space-y-4"></div>
        </div>
    </main>

    <div id="toastContainer" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_URL = "https://prompt-tx2e.onrender.com"; 
        const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const $ = id => document.getElementById(id);

        const moonSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
        const sunSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;

        let isMenuOpen = false;
        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            const menu = $('dropdownMenu'); const overlay = $('menuOverlay');
            if (isMenuOpen) {
                menu.classList.remove('hidden'); overlay.classList.add('active');
                setTimeout(() => { menu.classList.remove('opacity-0', 'scale-95'); menu.classList.add('opacity-100', 'scale-100'); }, 10);
            } else {
                menu.classList.remove('opacity-100', 'scale-100'); menu.classList.add('opacity-0', 'scale-95');
                overlay.classList.remove('active'); setTimeout(() => { menu.classList.add('hidden'); }, 200);
            }
        }
        $('btnHamburger').addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        $('menuOverlay').addEventListener('click', () => { if (isMenuOpen) toggleMenu(); });

        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark', dark); document.documentElement.classList.toggle('light', !dark);
            $('themeIconMenu').innerHTML = dark ? sunSVG : moonSVG; $('themeTextMenu').textContent = dark ? 'Chế độ Sáng' : 'Chế độ Tối';
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }
        applyTheme(document.documentElement.classList.contains('dark'));
        $('themeToggleMenu').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            let textArea = document.createElement("textarea"); textArea.value = text; textArea.style.position = "absolute"; textArea.style.left = "-999999px";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            return new Promise((res, rej) => { try { document.execCommand('copy'); res(); } catch (e) { rej(e); } finally { textArea.remove(); } });
        }
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer'); const toast = document.createElement('div');
            toast.className = `toast-msg toast-${type}`; toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
            container.appendChild(toast); setTimeout(() => toast.classList.add('toast-show'), 10);
            setTimeout(() => { toast.classList.remove('toast-show'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function fetchLibrary() {
            const list = $('libraryList'); const loading = $('libraryLoading');
            list.innerHTML = ''; loading.style.display = 'block';
            try {
                const res = await fetch(`${API_URL}/top_prompts`);
                const data = await res.json();
                if (data.prompts && data.prompts.length > 0) {
                    data.prompts.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'border border-slate-200 dark:border-slate-700/60 rounded-2xl p-4 bg-slate-50 dark:bg-slate-800/80 shadow-sm flex flex-col gap-3';
                        const safePrompt = encodeURIComponent(item.prompt); 
                        card.innerHTML = `
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-1 rounded text-[10px] font-bold text-white bg-blue-500">${escapeHtml(item.type)}</span>
                                    <span class="text-xs text-slate-500 font-medium">${new Date(item.created_at).toLocaleDateString('vi-VN')}</span>
                                </div>
                                <span class="text-lg font-extrabold text-green-500">${item.total_score} <span class="text-xs text-slate-400 font-semibold">điểm</span></span>
                            </div>
                            <div class="relative">
                                <div class="max-h-40 overflow-y-auto bg-white dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700/50">
                                    <p class="text-[13px] text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.prompt)}</p>
                                </div>
                            </div>
                            <div class="flex justify-end mt-1">
                                <button class="btn-copy-lib text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5" data-prompt="${safePrompt}">
                                    <span>Copy Prompt</span>
                                </button>
                            </div>
                        `;
                        list.appendChild(card);
                        card.querySelector('.btn-copy-lib').addEventListener('click', async function() {
                            const textToCopy = decodeURIComponent(this.getAttribute('data-prompt'));
                            try {
                                await copyTextToClipboard(textToCopy); showToast("Đã copy vào bộ nhớ tạm!", "success");
                                const original = this.innerHTML; this.innerHTML = '<span class="text-green-600 dark:text-green-400">Đã copy!</span>';
                                setTimeout(() => { this.innerHTML = original; }, 2000);
                            } catch (err) { showToast("Trình duyệt không cho phép copy.", "error"); }
                        });
                    });
                } else { list.innerHTML = '<p class="text-center text-slate-500 text-sm py-4">Chưa có Prompt nào đạt 8 điểm.</p>'; }
            } catch (e) { list.innerHTML = '<p class="text-center text-red-500 text-sm py-4">Lỗi tải dữ liệu.</p>'; } finally { loading.style.display = 'none'; }
        }
        fetchLibrary();
    </script>
</body>
</html>
