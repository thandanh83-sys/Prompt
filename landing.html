<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta name="theme-color" content="#f8f7fc">
    <title>Đánh giá Prompt - Trợ lý AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);

        let savedTheme = null;
        try { savedTheme = window.localStorage.getItem('theme'); } catch (error) { }
        const useDarkTheme = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', useDarkTheme);
        document.documentElement.classList.toggle('light', !useDarkTheme);
        
        if (useDarkTheme) {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1120');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <style>
        html { background-color: #f8f7fc; transition: background-color .15s ease; min-height: 100vh; min-height: 100dvh; scroll-behavior: smooth; }
        html.dark { background-color: #0b1120 !important; }
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; background-color: transparent !important; overscroll-behavior-y: none; min-height: 100vh; min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); }
        .page-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: #f8f7fc; background-image: radial-gradient(circle at 50% -20%, rgba(236,72,153,0.15) 0%, transparent 70%), radial-gradient(circle at 50% 120%, rgba(59,130,246,0.15) 0%, transparent 70%); }
        html.dark .page-bg { background-color: #0b1120; background-image: radial-gradient(ellipse at 50% -10%, rgba(236, 72, 153, 0.5) 0%, rgba(168, 85, 247, 0.3) 50%, transparent 80%), radial-gradient(ellipse at 50% 110%, rgba(59, 130, 246, 0.4) 0%, transparent 80%); }
        .app-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-color: rgba(0,0,0,.06); transition: all .2s; }
        .dark .app-header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-color: rgba(255,255,255,.1); }
        .brand-text { background: linear-gradient(100deg, #ec4899, #a052c8 52%, #3979f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn-glow { box-shadow: 0 4px 20px rgba(236,72,153,.3); transition: all .2s ease; }
        .btn-glow:hover { box-shadow: 0 6px 25px rgba(59,130,246,.5); transform: translateY(-2px); }
        .menu-dropdown { transition: all .2s ease-in-out; transform-origin: top left; width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 100px); overflow-y: auto; box-sizing: border-box; }
        #promptInput { white-space: pre-wrap; overflow-wrap: anywhere; }
        .toast-msg { background-color: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,.1); opacity: 0; transform: translateY(20px); transition: all .3s ease; pointer-events: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; z-index: 99999; }
        .toast-success { border-left: 4px solid #22c55e; }
        .toast-error { border-left: 4px solid #ef4444; }
        .toast-show { opacity: 1; transform: translateY(0); }
    </style>
</head>

<body class="antialiased font-sans min-h-screen relative text-slate-800 dark:text-slate-200 flex flex-col">
    <div class="page-bg"></div>

    <!-- HEADER -->
    <header class="app-header fixed top-0 left-0 w-full z-50 border-b pt-[env(safe-area-inset-top,0px)]">
        <div class="w-full max-w-7xl mx-auto px-3 sm:px-6 h-16 md:h-20 grid grid-cols-3 items-center">
            <div class="flex items-center justify-start relative z-50">
                <button id="btnHamburger" class="w-10 h-10 shrink-0 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
            <div class="flex items-center justify-center z-40">
                <a href="./index.html" class="flex items-center gap-1.5 min-w-0 no-underline focus:outline-none">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 shrink-0" viewBox="0 0 24 24"><defs><linearGradient id="brandSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><path fill="url(#brandSparkGradient)" d="M12 2L14.7 9.3 22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></svg>
                    <span class="brand-text text-sm sm:text-base font-extrabold truncate">Trợ lý AI</span>
                </a>
            </div>
            <div class="flex items-center justify-end z-50">
                <button id="btnShowLogin" class="px-3 py-1.5 md:px-5 md:py-2.5 rounded-full text-xs md:text-sm font-bold text-white bg-gradient-to-r from-pink-500 to-blue-500 shadow-sm hover:scale-105 transition-all">
                    Đăng nhập
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="w-full max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 md:pt-32 pb-32 flex-grow flex flex-col mt-4 z-10 min-h-screen">
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold mb-3 flex items-center justify-center gap-2">
                <span class="brand-text">Trợ lý tối ưu hoá Prompt</span>
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm md:text-base font-medium">AI tự động nhận diện lĩnh vực và tạo Prompt chuẩn chuyên gia.</p>
        </div>
        <!-- Bạn có thể giữ nguyên phần form nhập liệu ở đây, mình rút gọn để bạn dễ nhìn -->
    </main>

    <!-- MODAL HƯỚNG DẪN SỬ DỤNG -->
    <div id="guideModal" class="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#1e293b] border border-slate-700/50 rounded-3xl shadow-2xl w-full max-w-[400px] p-6 sm:p-7 relative transform scale-95 transition-transform duration-300" id="guideModalContent">
            
            <button type="button" id="btnCloseGuide" class="absolute top-5 right-5 text-slate-300 hover:text-white bg-slate-700/50 hover:bg-slate-600 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            
            <h2 class="text-[26px] font-extrabold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 tracking-tight">Hướng dẫn sử dụng</h2>
            
            <div class="space-y-6 mb-8">
                <div class="flex gap-4 items-start">
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm shrink-0 shadow-sm">1</div>
                    <div class="pt-0.5">
                        <h4 class="font-bold text-white text-[15px] mb-1">Nhập ý tưởng của bạn</h4>
                        <p class="text-[13px] text-slate-400">VD: "viết bài văn tả mẹ", "code web"</p>
                    </div>
                </div>
                <div class="flex gap-4 items-start">
                    <div class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center text-white font-bold text-sm shrink-0 shadow-sm">2</div>
                    <div class="pt-0.5">
                        <h4 class="font-bold text-white text-[15px] mb-1">AI chấm điểm</h4>
                        <p class="text-[13px] text-slate-400">Chỉ ra điểm yếu và gợi ý tư duy</p>
                    </div>
                </div>
                <div class="flex gap-4 items-start">
                    <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold text-sm shrink-0 shadow-sm">3</div>
                    <div class="pt-0.5">
                        <h4 class="font-bold text-white text-[15px] mb-1">Copy & Sử dụng</h4>
                        <p class="text-[13px] text-slate-400">Dán Prompt vào ChatGPT/Claude</p>
                    </div>
                </div>
            </div>
            
            <button id="btnStartApp" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-pink-500 to-blue-500 shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-95 transition-all text-[15px]">
                Đã hiểu, Bắt đầu
            </button>
        </div>
    </div>

    <script>
        // CHỜ TRANG TẢI XONG HOÀN TOÀN RỒI MỚI CHẠY JS
        window.addEventListener('load', () => {
            console.log("Trang đã tải xong, chuẩn bị hiện Hướng dẫn...");
            
            const guideModal = document.getElementById('guideModal');
            const guideContent = document.getElementById('guideModalContent');
            const btnCloseGuide = document.getElementById('btnCloseGuide');
            const btnStartApp = document.getElementById('btnStartApp');

            function showGuide() { 
                if (!guideModal || !guideContent) {
                    console.error("LỖI: Không tìm thấy thẻ div id='guideModal' hoặc 'guideModalContent' trong HTML!");
                    return;
                }
                guideModal.classList.remove('hidden'); 
                setTimeout(() => { 
                    guideModal.classList.remove('opacity-0'); 
                    guideContent.classList.remove('scale-95'); 
                    guideContent.classList.add('scale-100'); 
                }, 10); 
            }

            function hideGuide() { 
                if (!guideModal || !guideContent) return;
                guideModal.classList.add('opacity-0'); 
                guideContent.classList.remove('scale-100'); 
                guideContent.classList.add('scale-95'); 
                setTimeout(() => { guideModal.classList.add('hidden'); }, 300); 
            }
            
            // Bật lên sau 1 giây kể từ khi tải xong
            setTimeout(showGuide, 1000);
            
            if (btnCloseGuide) btnCloseGuide.addEventListener('click', hideGuide);
            if (btnStartApp) btnStartApp.addEventListener('click', hideGuide);
            if (guideModal) guideModal.addEventListener('click', (e) => { if (e.target === guideModal) hideGuide(); });
        });
    </script>
</body>
</html>
