    <script>
        const API_URL = "https://prompt-tx2e.onrender.com"; 
        const SUPABASE_URL = "https://egncrbearrwfoslryuga.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOi..."; // DÁN KEY ANON VÀO ĐÂY
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const SECTION_NAMES = ["1. VAI TRÒ", "2. BỐI CẢNH", "3. INPUT", "4. MỤC TIÊU", "5. YÊU CẦU", "6. RÀNG BUỘC", "7. TASK", "8. ĐỊNH DẠNG ĐẦU RA", "9. NEVER DO", "10. THỨ TỰ ƯU TIÊN", "11. XỬ LÝ NỘI BỘ"];
        const $ = id => document.getElementById(id);
        let lastResult = null;

        const ERROR_NAMES = { "A01": "Lỗi chính tả", "A02": "Thiếu dấu câu", "A03": "Lặp lại", "B01": "Thiếu cấu trúc", "B02": "Mục không logic", "B03": "Sai phân cấp", "B04": "Chưa định dạng", "C01": "Đối tượng chưa rõ", "C02": "Thiếu bối cảnh", "C03": "Chung chung", "C04": "Thiếu ví dụ", "D01": "Mâu thuẫn", "D02": "Bất khả thi", "D03": "Vai trò sai", "E01": "Trộn lĩnh vực", "E02": "Thuật ngữ lộn xộn", "E03": "Thiếu đặc thù" };

        // Lấy các hàm theme, menu, login giữ nguyên như cũ...
        // ...
        
        $('btnEvaluate').addEventListener('click', async () => {
            const prompt = promptInput.value.trim(); $('resultArea').style.display = 'none'; 
            if (!prompt) { $('errorMsg').style.display = 'block'; promptInput.focus(); return; }
            $('errorMsg').style.display = 'none';
            const btn = $('btnEvaluate'); const btnText = $('btnText'); const spinner = $('loadingSpinner');
            btn.disabled = true; spinner.classList.remove('hidden');
            let seconds = 0; btnText.textContent = 'Đang kết nối (0s)...';
            const timer = setInterval(() => { seconds++; btnText.textContent = seconds < 15 ? `Đang đợi Server (${seconds}s)...` : `AI đang xử lý (${seconds}s)...`; }, 1000);
            
            try {
                const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 180000);
                const response = await fetch(`${API_URL}/evaluate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }), signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) { 
                    const d = await response.json(); 
                    throw new Error(d.error || d.detail || 'Lỗi không xác định từ Server'); 
                }
                
                lastResult = await response.json();
                render(lastResult);
                
                // LƯU LỊCH SỬ VÀO LOCAL STORAGE (ĐÃ FIX TRÀN BỘ NHỚ)
                try {
                    let localHistory = JSON.parse(localStorage.getItem('myPromptHistory') || '[]');
                    localHistory.push({
                        date: new Date().toISOString(),
                        prompt: prompt.length > 2000 ? prompt.slice(0, 2000) + '…' : prompt,
                        score: lastResult.total, type: lastResult.type,
                        rewrite: lastResult.rewrite, errors: lastResult.errors, details: lastResult.details
                    });
                    if (localHistory.length > 100) localHistory = localHistory.slice(-100); // Chỉ giữ 100 cái
                    localStorage.setItem('myPromptHistory', JSON.stringify(localHistory));
                } catch (e) {
                    let h = JSON.parse(localStorage.getItem('myPromptHistory') || '[]').slice(-50);
                    try { localStorage.setItem('myPromptHistory', JSON.stringify(h)); } catch {}
                }
                
            } catch (e) { 
                $('errorMsg').textContent = e.message || "Đã xảy ra lỗi kết nối."; $('errorMsg').style.display = 'block'; 
            } finally { 
                clearInterval(timer); btn.disabled = false; spinner.classList.add('hidden'); btnText.textContent = 'Đánh giá & Viết lại'; 
            }
        });

        // Hàm render và các hàm khác giữ nguyên...
        function render(r) {
            $('totalScore').textContent = r.total; const sb = $('scoreBar'); sb.style.width = `${r.total * 10}%`;
            sb.className = r.total >= 8 ? 'h-1.5 rounded-full bg-green-500' : (r.total >= 5 ? 'h-1.5 rounded-full bg-yellow-500' : 'h-1.5 rounded-full bg-red-500');
            $('promptType').textContent = r.type;
            
            $('criteriaList').replaceChildren();
            Object.entries(r.details).forEach(([name, score]) => {
                const row = document.createElement('div'); 
                row.innerHTML = `<div class="flex justify-between items-start mb-1.5"><span class="text-[10px] font-semibold text-slate-600 dark:text-slate-400 leading-tight pr-1 line-clamp-2">${name}</span><span class="text-xs font-bold">${score}</span></div><div class="w-full bg-slate-100 dark:bg-slate-700/50 rounded-full h-1.5"><div class="h-1.5 rounded-full bg-gradient-to-r from-pink-500 to-blue-500" style="width: ${score * 10}%"></div></div>`;
                $('criteriaList').appendChild(row);
            });
            
            $('userErrorList').replaceChildren();
            if (r.errors?.length > 0) {
                r.errors.forEach(err => {
                    const errName = ERROR_NAMES[err.code] || "Lỗi chưa xác định";
                    const li = document.createElement('li'); 
                    li.className = 'mb-3 p-3.5 bg-slate-50 dark:bg-slate-900/30 rounded-xl border border-slate-100 dark:border-slate-700/50 text-xs';
                    li.innerHTML = `<div class="flex justify-between items-center w-full mb-1"><p class="font-bold text-slate-800 dark:text-slate-200 text-sm">${errName}</p><span class="text-[9px] font-bold bg-red-100 text-red-700 px-1.5 py-0.5 rounded-md uppercase">Cần cải thiện</span></div>`;
                    $('userErrorList').appendChild(li);
                });
            } else { $('userErrorList').innerHTML = '<li class="text-green-600 text-xs font-semibold p-3.5 bg-green-50 rounded-xl">Tuyệt vời! Không phát hiện lỗi nào.</li>'; }

            $('rewriteList').replaceChildren();
            SECTION_NAMES.forEach(sec => {
                const item = document.createElement('div'); item.className = 'mb-4 last:mb-0'; 
                item.innerHTML = `<p class="font-bold text-pink-500 mb-1 text-[11px] uppercase">${sec}</p><p class="text-slate-700 dark:text-slate-300 whitespace-pre-wrap text-sm leading-relaxed">${r.rewrite[sec] || ''}</p>`;
                $('rewriteList').appendChild(item);
            });
            $('resultArea').style.display = 'block';
            setTimeout(() => { $('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }
    </script>
</body>
</html>
