<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá Prompt - Trợ lý AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background-color .15s ease, color .15s ease; }
        .glass-card { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
        .pre-wrap { white-space: pre-wrap; }
        #promptInput { white-space: pre-wrap; overflow-wrap: anywhere; }
        .dark-glow { background: radial-gradient(ellipse at 18% 10%, rgba(229,112,196,.16) 0%, transparent 38%), radial-gradient(ellipse at 82% 35%, rgba(90,129,255,.12) 0%, transparent 42%), #f8f7fc; }
        .dark.dark-glow { background: radial-gradient(ellipse at 18% 10%, rgba(164,55,130,.13) 0%, transparent 38%), radial-gradient(ellipse at 82% 35%, rgba(53,84,180,.14) 0%, transparent 42%), #0f172a; }
        .brand-text { background: linear-gradient(100deg, #e743a3, #a052c8 52%, #3979f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .app-header { background: #fff; border-color: rgba(0,0,0,.06); } .dark .app-header { background: #0f172a; border-color: rgba(255,255,255,.1); }
        .btn-glow { box-shadow: 0 4px 15px rgba(236,72,153,.3); } .btn-glow:hover { box-shadow: 0 6px 20px rgba(59,130,246,.5); transform: translateY(-1px); }
        .menu-dropdown { transition: all .2s; transform-origin: top left; width: min(290px, calc(100vw - 24px)); max-height: calc(100dvh - 100px); overflow-y: auto; }
        .toast-msg { background-color: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; opacity: 0; transform: translateY(20px); transition: all .3s ease; pointer-events: auto; display: flex; align-items: center; gap: 8px; }
        .toast-success { border-left: 4px solid #22c55e; } .toast-error { border-left: 4px solid #ef4444; } .toast-show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="antialiased min-h-screen relative text-slate-800 dark:text-slate-100 transition-colors duration-300 bg-slate-50 dark:bg-slate-900 dark-glow flex flex-col">
    <header class="app-header fixed top-0 left-0 w-full z-50 border-b">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <div class="relative flex items-center">
                <button id="btnHamburger" class="w-10 h-10 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                <div id="dropdownMenu" class="menu-dropdown absolute top-12 left-0 bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl hidden opacity-0 scale-95 z-50">
                    <div class="flex flex-col py-2">
                        <a href="./index.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-semibold">🏠 Trang chủ</a>
                        <a href="./landing.html" class="flex items-center gap-3 px-4 py-3 bg-slate-50 dark:bg-slate-700/50 text-sm font-semibold text-pink-500">⚡ Đánh giá (Hiện tại)</a>
                        <a href="./library.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-semibold">📚 Thư viện</a>
                    </div>
                </div>
            </div>
            <a href="./index.html" class="flex items-center gap-2"><svg class="w-7 h-7" viewBox="0 0 24 24"><defs><linearGradient id="brandSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><path fill="url(#brandSparkGradient)" d="M12 2L14.7 9.3 22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></svg><span class="brand-text text-lg font-extrabold">Trợ lý AI</span></a>
            <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300"><svg id="themeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
        </div>
    </header>

    <main class="w-full max-w-3xl mx-auto px-4 pt-24 pb-32 flex-grow flex flex-col" id="mainContainer">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold mb-2">Đánh giá Prompt</h1>
            <p class="text-slate-500 text-sm">AI tự động nhận diện và tạo Prompt chuẩn chuyên gia.</p>
        </div>

        <div class="glass-card bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 shadow-sm rounded-3xl p-5">
            <div class="relative">
                <textarea id="promptInput" maxlength="5000" class="w-full h-36 p-4 pb-10 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 focus:ring-1 focus:ring-pink-500 resize-none text-sm" placeholder="Mô tả điều bạn muốn AI thực hiện..."></textarea>
                <div class="absolute bottom-3 right-4 flex items-center gap-3"><span id="charCount" class="text-[11px] text-slate-400">0/5000</span><button id="btnClearInput" class="hidden text-slate-400 hover:text-red-500"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12" /></svg></button></div>
            </div>
            <p id="errorMsg" class="text-red-500 text-xs mt-2 hidden">Vui lòng nhập prompt!</p>
            <button id="btnEvaluate" class="w-full mt-4 py-3.5 rounded-2xl font-bold bg-gradient-to-r from-pink-500 to-blue-500 text-white shadow-md btn-glow text-sm flex items-center justify-center gap-2">
                <span id="btnText">Đánh giá & Viết lại</span><svg id="loadingSpinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            </button>
        </div>

        <div id="resultArea" class="mt-8 space-y-5 hidden">
            <div class="glass-card bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 shadow-sm rounded-3xl p-6 flex justify-between items-start">
                <div class="flex flex-col w-1/2 pt-1"><p class="text-[11px] font-bold text-slate-400 uppercase">Điểm tổng</p><div class="flex items-baseline"><span id="totalScore" class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500">0.0</span><span class="text-sm font-bold text-slate-400 ml-1">/ 10</span></div><div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full mt-3"><div id="scoreBar" class="h-1.5 rounded-full bg-gradient-to-r from-pink-500 to-blue-500 transition-all duration-1000" style="width: 0%"></div></div></div>
                <div class="flex flex-col items-end justify-center w-1/2"><p class="text-[11px] font-bold text-slate-400 uppercase mb-2">Phân loại</p><div class="flex flex-wrap justify-end gap-1.5"><span id="promptType" class="px-3 py-1 rounded-full text-[11px] font-bold text-white shadow-sm bg-blue-500">PROMPT</span><div id="techniqueBadges" class="flex flex-wrap gap-1.5"></div></div></div>
            </div>
            <div id="strengthsCard" class="glass-card bg-green-50/50 border border-green-200 rounded-3xl p-6 hidden"><h3 class="font-bold text-sm mb-3 text-green-700">🌟 Điểm sáng của bạn</h3><ul id="strengthsList" class="space-y-2 text-sm list-disc pl-4"></ul></div>
            <div class="glass-card bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 shadow-sm rounded-3xl p-6"><h3 class="font-bold text-sm mb-4 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-red-500"></span> Điểm nên luyện thêm</h3><ul id="userErrorList" class="space-y-3 text-sm"></ul></div>
            <div class="glass-card bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 shadow-sm rounded-3xl p-6"><h3 class="font-bold text-sm mb-5 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span> Chi tiết điểm</h3><div id="criteriaList" class="grid grid-cols-2 gap-x-4 gap-y-4"></div></div>
            <div class="glass-card bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 shadow-sm rounded-3xl overflow-hidden">
                <div class="flex justify-between items-center px-5 py-3 border-b border-slate-200 dark:border-slate-700/50 bg-slate-50 dark:bg-slate-900/40">
                    <h3 class="font-bold text-sm flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-indigo-500"></span> Bản sửa hoàn chỉnh</h3>
                    <button id="btnCopyAll" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-white dark:bg-slate-800 rounded-md border border-slate-200"><span id="copyBtnText">Sao chép</span></button>
                </div>
                <div id="rewriteList" class="p-5 space-y-5 text-sm"></div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

<script>
    const API_URL = "https://prompt-tx2e.onrender.com"; 
    const SECTION_NAMES = ["1. VAI TRÒ", "2. BỐI CẢNH", "3. INPUT", "4. MỤC TIÊU", "5. YÊU CẦU", "6. RÀNG BUỘC", "7. TASK", "8. ĐỊNH DẠNG ĐẦU RA", "9. NEVER DO", "10. THỨ TỰ ƯU TIÊN", "11. XỬ LÝ NỘI BỘ"];
    const $ = id => document.getElementById(id);
    let lastResult = null;

    function copyTextToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        let textArea = document.createElement("textarea"); textArea.value = text; textArea.style.position = "absolute"; textArea.style.left = "-999999px"; document.body.appendChild(textArea); textArea.focus(); textArea.select();
        return new Promise((res, rej) => { try { document.execCommand('copy'); res(); } catch (error) { rej(error); } finally { textArea.remove(); } });
    }
    function showToast(msg, type = 'success') {
        const container = $('toastContainer'), toast = document.createElement('div'); toast.className = `toast-msg toast-${type}`;
        toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${msg}</span>`;
        container.appendChild(toast); setTimeout(() => toast.classList.add('toast-show'), 10);
        setTimeout(() => { toast.classList.remove('toast-show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    const btnHamburger = $('btnHamburger'), dropdownMenu = $('dropdownMenu'); let isMenuOpen = false;
    btnHamburger.addEventListener('click', (e) => { e.stopPropagation(); isMenuOpen = !isMenuOpen; if (isMenuOpen) { dropdownMenu.classList.remove('hidden'); setTimeout(() => { dropdownMenu.classList.remove('opacity-0', 'scale-95'); dropdownMenu.classList.add('opacity-100', 'scale-100'); }, 10); } else { dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95'); setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200); } });
    document.addEventListener('click', (e) => { if (isMenuOpen && !dropdownMenu.contains(e.target) && e.target !== btnHamburger) { isMenuOpen = false; dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95'); setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200); } });

    const moonSVG = `<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>`;
    const sunSVG = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>`;
    function applyTheme(dark) {
        const root = document.documentElement; root.classList.toggle('dark', dark);
        $('themeIcon').innerHTML = dark ? sunSVG : moonSVG;
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    applyTheme(document.documentElement.classList.contains('dark'));
    $('themeToggle').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

    const promptInput = $('promptInput'), charCount = $('charCount'), btnClearInput = $('btnClearInput');
    promptInput.addEventListener('input', () => { const len = promptInput.value.length; charCount.textContent = `${len}/5000`; if (len > 0) btnClearInput.classList.remove('hidden'); else btnClearInput.classList.add('hidden'); });
    btnClearInput.addEventListener('click', () => { promptInput.value = ''; charCount.textContent = '0/5000'; btnClearInput.classList.add('hidden'); promptInput.focus(); });

    const typeMap = { "PROMPT": "PROMPT", "TEMPLATE": "TEMPLATE", "PROMPT META": "META", "TABLE": "TABLE", "STEM": "STEM", "IMAGE": "IMAGE" };
    const typeColors = { "PROMPT": "bg-blue-500", "TEMPLATE": "bg-purple-500", "META": "bg-orange-500", "TABLE": "bg-teal-500", "STEM": "bg-green-500", "IMAGE": "bg-pink-500" };
    const ERROR_NAMES = { "A01": "Lỗi chính tả", "A02": "Thiếu dấu câu", "A03": "Lặp lại", "B01": "Thiếu cấu trúc", "B02": "Mục không logic", "B03": "Sai phân cấp", "B04": "Chưa định dạng", "C01": "Đối tượng chưa rõ", "C02": "Thiếu bối cảnh", "C03": "Chung chung", "C04": "Thiếu ví dụ", "D01": "Mâu thuẫn", "D02": "Bất khả thi", "D03": "Vai trò sai", "E01": "Trộn lĩnh vực", "E02": "Thuật ngữ lộn xộn", "E03": "Thiếu đặc thù" };
    const TECH_NAMES = { "ROLE_PLAY": "Đóng vai", "FEW_SHOT": "Ví dụ mẫu", "CHAIN_OF_THOUGHT": "Suy luận", "FORMATTED_OUTPUT": "Định dạng", "CREATIVE_GEN": "Sáng tạo" };

    async function evaluatePrompt(prompt) {
        const controller = new AbortController(); const timeoutId = setTimeout(() => controller.abort(), 180000); 
        try {
            const response = await fetch(`${API_URL}/evaluate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: prompt }), signal: controller.signal });
            clearTimeout(timeoutId); if (!response.ok) { const data = await response.json(); throw new Error(data.error || data.detail || `Lỗi`); }
            return await response.json();
        } catch (error) { clearTimeout(timeoutId); if (error.name === 'AbortError') throw new Error("Quá thời gian chờ."); throw error; }
    }

    function render(r) {
        if (!r || !r.details || !r.rewrite) throw new Error("Dữ liệu trả về không đúng định dạng.");
        const scoreNum = parseFloat(r.total); $('totalScore').textContent = r.total; 
        const scoreBar = $('scoreBar'); scoreBar.style.width = `${scoreNum * 10}%`;
        if (scoreNum >= 8) scoreBar.className = 'h-1.5 rounded-full bg-green-500 transition-all duration-1000'; 
        else if (scoreNum >= 5) scoreBar.className = 'h-1.5 rounded-full bg-yellow-500 transition-all duration-1000'; 
        else scoreBar.className = 'h-1.5 rounded-full bg-red-500 transition-all duration-1000';

        const pType = $('promptType'); const mappedType = typeMap[r.type] || r.type; 
        pType.textContent = mappedType; pType.className = `px-3 py-1 rounded-full text-[11px] font-bold text-white shadow-sm ${typeColors[mappedType] || 'bg-slate-500'}`;
        
        const techContainer = $('techniqueBadges'); techContainer.replaceChildren();
        if (r.techniques && r.techniques.length > 0) r.techniques.forEach(tech => { const span = document.createElement('span'); span.className = 'px-2 py-1 rounded-md text-[10px] font-semibold bg-slate-200 text-slate-700'; span.textContent = TECH_NAMES[tech] || tech; techContainer.appendChild(span); });
        
        const strengthsCard = $('strengthsCard'), strengthsList = $('strengthsList'); strengthsList.replaceChildren(); let hasStrength = false;
        Object.entries(r.details).forEach(([name, score]) => { if (score >= 7) { hasStrength = true; const li = document.createElement('li'); li.innerHTML = `Rất tốt ở <strong>${name}</strong> (${score}/10).`; strengthsList.appendChild(li); } });
        strengthsCard.style.display = hasStrength ? 'block' : 'none';

        const list = $('criteriaList'); list.replaceChildren();
        Object.entries(r.details).forEach(([name, score]) => {
            const row = document.createElement('div'), headerDiv = document.createElement('div'); headerDiv.className = 'flex justify-between items-start mb-1.5';
            const spanName = document.createElement('span'); spanName.className = 'text-[10px] font-semibold text-slate-600 leading-tight pr-1 line-clamp-2'; spanName.textContent = name;
            const spanScore = document.createElement('span'); spanScore.className = 'text-xs font-bold text-slate-800'; spanScore.textContent = `${score}`;
            headerDiv.appendChild(spanName); headerDiv.appendChild(spanScore);
            const barBg = document.createElement('div'); barBg.className = 'w-full bg-slate-100 rounded-full h-1.5';
            const barFill = document.createElement('div'); barFill.className = `h-1.5 rounded-full bg-gradient-to-r from-pink-500 to-blue-500`; barFill.style.width = `${score * 10}%`;
            barBg.appendChild(barFill); row.appendChild(headerDiv); row.appendChild(barBg); list.appendChild(row);
        });

        const userErrList = $('userErrorList'); userErrList.replaceChildren();
        if (r.errors && r.errors.length > 0) {
            r.errors.forEach(err => {
                const errName = ERROR_NAMES[err.code] || "Lỗi"; let evidenceText = "";
                if (err.evidence && err.evidence !== "Toàn bộ" && err.evidence !== errName) evidenceText = `"${err.evidence}"`;
                let suggestion = "Hãy bổ sung chi tiết."; let severity = "bg-yellow-100 text-yellow-700"; let severityText = "Trung bình";
                if (errName.includes("bối cảnh")) { suggestion = "Đã nêu rõ hoàn cảnh chưa?"; severity = "bg-red-100 text-red-700"; severityText = "Nghiêm trọng"; }
                const li = document.createElement('li'); li.className = 'mb-3 p-3.5 bg-slate-50 rounded-xl border border-slate-100';
                const headerDiv = document.createElement('div'); headerDiv.className = 'flex justify-between items-start mb-1';
                const pName = document.createElement('p'); pName.className = 'text-slate-800 font-bold text-xs'; pName.textContent = errName;
                const spanSev = document.createElement('span'); spanSev.className = `text-[10px] px-2 py-0.5 rounded-md font-bold ${severity}`; spanSev.textContent = severityText;
                headerDiv.appendChild(pName); headerDiv.appendChild(spanSev);
                const pDetail = document.createElement('p'); pDetail.className = 'text-[11px] text-slate-500 mt-1.5';
                if (evidenceText) pDetail.innerHTML += `Trích dẫn: <i>${evidenceText}</i><br>`;
                pDetail.innerHTML += `<span class="text-blue-600 font-medium inline-block mt-1.5">💡 Gợi ý: ${suggestion}</span>`;
                li.appendChild(headerDiv); li.appendChild(pDetail); userErrList.appendChild(li);
            });
        } else { const li = document.createElement('li'); li.className = 'text-green-600 text-xs font-semibold p-3.5 bg-green-50 rounded-xl'; li.textContent = 'Tuyệt vời! Không phát hiện lỗi nào.'; userErrList.appendChild(li); }

        const rw = $('rewriteList'); rw.replaceChildren();
        SECTION_NAMES.forEach(sec => {
            const item = document.createElement('div'); item.className = 'mb-4 last:mb-0'; 
            const pTitle = document.createElement('p'); pTitle.className = 'font-bold text-pink-500 mb-1 text-[11px] uppercase tracking-wider'; pTitle.textContent = sec;
            const pContent = document.createElement('p'); pContent.className = 'text-slate-700 break-words whitespace-pre-wrap text-sm leading-relaxed'; pContent.textContent = r.rewrite[sec] || '';
            item.appendChild(pTitle); item.appendChild(pContent); rw.appendChild(item);
        });
        $('resultArea').style.display = 'block';
    }

    $('btnEvaluate').addEventListener('click', async () => {
        const prompt = $('promptInput').value.trim(); $('resultArea').style.display = 'none'; 
        if (!prompt) { $('errorMsg').classList.remove('hidden'); $('promptInput').focus(); return; }
        $('errorMsg').classList.add('hidden');
        const btn = $('btnEvaluate'), btnText = $('btnText'), spinner = $('loadingSpinner');
        btn.disabled = true; spinner.classList.remove('hidden'); let seconds = 0; btnText.textContent = 'Đang kết nối (0s)...';
        const timer = setInterval(() => { seconds++; btnText.textContent = `AI đang xử lý (${seconds}s)...`; }, 1000);
        try {
            lastResult = await evaluatePrompt(prompt); render(lastResult); 
            setTimeout(() => { $('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        } catch (e) { $('errorMsg').textContent = e.message || "Đã xảy ra lỗi."; $('errorMsg').classList.remove('hidden'); } 
        finally { clearInterval(timer); btn.disabled = false; spinner.classList.add('hidden'); btnText.textContent = 'Đánh giá & Viết lại'; }
    });

    $('btnCopyAll').addEventListener('click', async () => {
        if (!lastResult) return; 
        let text = ""; SECTION_NAMES.forEach(sec => { text += `${sec}:\n${lastResult.rewrite[sec] || ''}\n\n`; });
        try {
            await copyTextToClipboard(text); showToast("Đã sao chép toàn bộ Prompt!", "success");
            const btn = $('btnCopyAll'), btnText = $('copyBtnText'), originalHTML = btn.innerHTML; 
            btnText.textContent = 'Đã chép!'; btnText.classList.add('text-green-500');
            setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
        } catch (e) { showToast("Không thể sao chép.", "error"); }
    });
</script>
</body>
</html>
