<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7fc">
    <title>Trang cá nhân - Trợ lý AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } else { document.documentElement.classList.remove('dark'); }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <style>
        html { background-color: #f8f7fc; transition: background-color .15s ease; min-height: 100vh; }
        html.dark { background-color: #0f172a; }
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background-color .15s ease, color .15s ease; background-color: #f8f7fc; overscroll-behavior-y: none; }
        .dark body { background-color: #0f172a; }
        .app-header { background: #fff; border-color: rgba(0,0,0,.06); }
        .dark .app-header { background: #0f172a; border-color: rgba(255,255,255,.1); }
        .brand-spark { flex-shrink: 0; }
        .brand-text { background: linear-gradient(100deg, #ec4899, #a052c8 52%, #3979f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .brand-icon-gradient { fill: url(#brandSparkGradient); }
        .menu-dropdown { transition: all .2s ease-in-out; transform-origin: top left; width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 100px); overflow-y: auto; box-sizing: border-box; }
        @media (max-width: 640px) { .menu-dropdown { width: min(260px, calc(100vw - 32px)); max-height: calc(100dvh - 88px); } }
        .glass-card { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    </style>
</head>

<body class="antialiased min-h-screen relative text-slate-800 dark:text-slate-100 flex flex-col">
    <div class="page-bg fixed inset-0 z-[-1] pointer-events-none bg-gradient-to-br from-pink-50/50 to-blue-50/50 dark:from-[#0b1120] dark:to-[#0f172a]"></div>

    <header class="app-header fixed top-0 left-0 w-full z-50 border-b">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-between gap-2 sm:gap-3">
            <div class="relative flex items-center gap-1 sm:gap-2">
                <button id="btnHamburger" class="w-10 h-10 shrink-0 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div id="dropdownMenu" class="menu-dropdown absolute top-12 left-0 bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl hidden opacity-0 scale-95 z-50 p-2">
                    <div class="flex flex-col gap-1">
                        <a href="./index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">Trang chủ</a>
                        <a href="./landing.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">Đánh giá</a>
                        <a href="./library.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">Thư viện</a>
                        <div class="h-px bg-slate-100 dark:bg-slate-700/50 my-1 mx-2"></div>
                        <button id="themeToggleMenu" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors text-left">
                            <span id="themeIconMenu" class="w-5 h-5 flex items-center justify-center shrink-0"></span><span id="themeTextMenu">Chế độ Tối</span>
                        </button>
                        <div id="adminMenuDivider" class="h-px bg-slate-100 dark:bg-slate-700/50 my-1 mx-2" style="display:none;"></div>
                        <a id="menuBtnAdmin" href="./admin.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-green-50 dark:hover:bg-green-900/20 text-sm font-semibold text-green-600 dark:text-green-400 transition-colors" style="display:none;">Quản trị</a>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 min-w-0">
                <svg class="brand-spark w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24"><defs><linearGradient id="brandSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><path class="brand-icon-gradient" d="M12 2L14.7 9.3 22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></svg>
                <span class="brand-text text-base sm:text-lg font-extrabold truncate">Trợ lý AI</span>
            </div>
            
            <div id="authContainer" class="flex items-center relative">
                <div id="userAvatarMenu" class="relative hidden">
                    <button id="btnAvatar" class="w-9 h-9 md:w-10 md:h-10 rounded-full overflow-hidden border-2 border-pink-500 shadow-sm hover:scale-105 transition-transform flex items-center justify-center bg-gray-200 dark:bg-gray-700 text-white font-bold text-lg"></button>
                    <div id="avatarDropdown" class="absolute right-0 top-12 w-48 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl hidden opacity-0 scale-95 transition-all z-50 p-2">
                        <a href="./profile.html" class="block px-3 py-2 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-pink-500">Trang cá nhân</a>
                        <button id="btnLogoutHeader" class="w-full text-left px-3 py-2 text-sm font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg mt-1">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto px-4 sm:px-6 pt-32 pb-32 flex-grow flex flex-col mt-4">
        <div id="userInfoBox" class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-md border border-slate-200 dark:border-slate-700 flex items-center gap-5 mb-8">
            <div id="avatarContainer" class="w-20 h-20 rounded-full bg-gradient-to-br from-pink-500 to-blue-500 flex items-center justify-center text-3xl text-white font-bold shrink-0 shadow-lg"></div>
            <div class="flex flex-col">
                <h2 id="userName" class="text-xl font-bold text-slate-800 dark:text-white">Đang tải...</h2>
                <p id="userEmail" class="text-sm text-slate-500 dark:text-slate-400">email@example.com</p>
                <button id="btnLogoutMain" class="text-left text-xs font-bold text-red-500 hover:text-red-700 mt-2 transition">Đăng xuất tài khoản</button>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-md border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-lg text-slate-800 dark:text-white">Lịch sử của bạn</h3>
                <div class="flex gap-2">
                    <button id="btnExport" class="px-3 py-1.5 text-xs font-bold bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 rounded-lg hover:bg-green-200 transition">Xuất JSON</button>
                    <button id="btnClearHistory" class="px-3 py-1.5 text-xs font-bold bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 rounded-lg hover:bg-red-200 transition">Xóa hết</button>
                </div>
            </div>
            
            <div id="historyList" class="space-y-4">
                <p class="text-center text-sm text-slate-500 py-6">Bạn chưa có lịch sử đánh giá nào trên thiết bị này.</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://egncrbearrwfoslryuga.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbmNyYmVhcnJ3Zm9zbHJ5dWdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDk2MzgsImV4cCI6MjEwODA4NTYzOH0.jX8rz7Fk5wIqdbDqb6ZwKUiMs-wggVRj-dLk2dqlYFM";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const $ = id => document.getElementById(id);

        const moonSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
        const sunSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;

        let isMenuOpen = false;
        $('btnHamburger').addEventListener('click', (e) => {
            e.stopPropagation(); isMenuOpen = !isMenuOpen;
            if (isMenuOpen) { $('dropdownMenu').classList.remove('hidden'); setTimeout(() => { $('dropdownMenu').classList.remove('opacity-0', 'scale-95'); $('dropdownMenu').classList.add('opacity-100', 'scale-100'); }, 10); } 
            else { $('dropdownMenu').classList.remove('opacity-100', 'scale-100'); $('dropdownMenu').classList.add('opacity-0', 'scale-95'); setTimeout(() => { $('dropdownMenu').classList.add('hidden'); }, 200); }
        });
        document.addEventListener('click', (e) => {
            if (isMenuOpen && !$('dropdownMenu').contains(e.target) && e.target !== $('btnHamburger')) {
                isMenuOpen = false; $('dropdownMenu').classList.remove('opacity-100', 'scale-100'); $('dropdownMenu').classList.add('opacity-0', 'scale-95'); setTimeout(() => { $('dropdownMenu').classList.add('hidden'); }, 200);
            }
        });
        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark', dark); document.documentElement.classList.toggle('light', !dark);
            $('themeIconMenu').innerHTML = dark ? sunSVG : moonSVG; $('themeTextMenu').textContent = dark ? 'Chế độ Sáng' : 'Chế độ Tối';
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            const themeColor = document.querySelector('meta[name="theme-color"]'); if (themeColor) themeColor.setAttribute('content', dark ? '#0f172a' : '#f8f7fc');
        }
        applyTheme(document.documentElement.classList.contains('dark'));
        $('themeToggleMenu').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

        async function checkUser() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = "./landing.html"; return;
            }
            const user = session.user;
            const displayName = user.email ? user.email.split('@')[0] : "Người dùng";
            $('userName').textContent = displayName;
            $('userEmail').textContent = user.email;
            
            const avatarBox = $('avatarContainer'); const avatarBtn = $('btnAvatar');
            const firstChar = displayName.charAt(0).toUpperCase();
            avatarBox.textContent = firstChar;
            avatarBtn.textContent = firstChar;

            $('userAvatarMenu').classList.remove('hidden');
        }
        checkUser();
        supabase.auth.onAuthStateChange(() => checkUser());

        function logout() { supabase.auth.signOut().then(() => { window.location.href = "./landing.html"; }); }
        $('btnLogoutMain').addEventListener('click', logout);
        $('btnLogoutHeader').addEventListener('click', logout);

        $('btnAvatar').addEventListener('click', (e) => { e.stopPropagation(); $('avatarDropdown').classList.remove('hidden'); setTimeout(() => $('avatarDropdown').classList.remove('opacity-0', 'scale-95'), 10); });
        document.addEventListener('click', () => { if (!$('avatarDropdown').classList.contains('hidden')) { $('avatarDropdown').classList.add('opacity-0', 'scale-95'); setTimeout(() => $('avatarDropdown').classList.add('hidden'), 200); } });

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('myPromptHistory') || '[]');
            const list = $('historyList');
            if (history.length === 0) return; 

            list.innerHTML = ''; 
            [...history].reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-4 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-slate-500">${new Date(item.date).toLocaleString('vi-VN')}</span>
                        <span class="text-sm font-bold text-pink-500">${item.score} điểm</span>
                    </div>
                    <p class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 truncate">${escapeHtml(item.prompt)}</p>
                `;
                list.appendChild(div);
            });
        }
        loadHistory();

        $('btnExport').addEventListener('click', () => {
            const data = localStorage.getItem('myPromptHistory') || '[]';
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `lich-su-prompt-${new Date().getTime()}.json`; a.click();
            URL.revokeObjectURL(url);
        });

        $('btnClearHistory').addEventListener('click', () => {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử trên máy này không?")) {
                localStorage.removeItem('myPromptHistory'); location.reload();
            }
        });
    </script>
</body>
</html>
