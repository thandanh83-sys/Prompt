    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);

        let savedTheme = null;
        try { savedTheme = window.localStorage.getItem('theme'); } catch (error) { }
        const useDarkTheme = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', useDarkTheme);
        document.documentElement.classList.toggle('light', !useDarkTheme);
        
        if (useDarkTheme) {
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', '#0b1120');
        }
    </script>

                    dropdown.classList.remove('opacity-100', 'scale-100');
                    dropdown.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => { if (dropdown.classList.contains('opacity-0')) dropdown.classList.add('hidden'); }, 200);
                }
            });
            document.addEventListener('click', (e) => {
                if (!dropdown.contains(e.target) && !hamburger.contains(e.target) && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.remove('opacity-100', 'scale-100');
                    dropdown.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => { if (dropdown.classList.contains('opacity-0')) dropdown.classList.add('hidden'); }, 200);
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.remove('opacity-100', 'scale-100');
                    dropdown.classList.add('opacity-0', 'scale-95');
                    setTimeout(() => { if (dropdown.classList.contains('opacity-0')) dropdown.classList.add('hidden'); }, 200);
                }
            });
        }

        // 2. THEME LOGIC
        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark', dark); document.documentElement.classList.toggle('light', !dark);
            if($('themeIconMenu')) $('themeIconMenu').innerHTML = dark ? sunSVG : moonSVG; 
            if($('themeTextMenu')) $('themeTextMenu').textContent = dark ? 'Chế độ Sáng' : 'Chế độ Tối';
            try { window.localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (error) { }
            const themeColor = document.querySelector('meta[name="theme-color"]'); 
            if (themeColor) themeColor.setAttribute('content', dark ? '#0b1120' : '#f8f7fc');
        }
        applyTheme(document.documentElement.classList.contains('dark'));
        if($('themeToggleMenu')) {
            $('themeToggleMenu').addEventListener('click', (e) => { 
                e.preventDefault(); e.stopPropagation(); 
                applyTheme(!document.documentElement.classList.contains('dark')); 
            });
        }

        // 3. AUTH & HIỂN THỊ
        async function checkUser() {
            if (!supabaseClient) return;
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (error || !session) {
                $('loginPrompt').style.display = 'flex';
                $('profileContent').style.display = 'none';
                $('userAvatarMenu').classList.add('hidden');
            } else {
                $('loginPrompt').style.display = 'none';
                $('profileContent').style.display = 'flex';
                
                const user = session.user;
                const displayName = user.email ? user.email.split('@')[0] : "Người dùng";
                const firstChar = displayName.charAt(0).toUpperCase();
                
                $('userName').textContent = displayName;
                $('userEmail').textContent = user.email || '';
                $('avatarContainer').textContent = firstChar;
                $('btnAvatar').textContent = firstChar;
                $('userAvatarMenu').classList.remove('hidden');
                
                loadHistory();
            }
        }
        checkUser();

        if (supabaseClient) {
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                    checkUser();
                } else if (event === 'SIGNED_OUT') {
                    window.location.reload();
                }
            });
        }

        // 4. ĐĂNG NHẬP BẰNG EMAIL (MAGIC LINK)
        $('btnSendMagicLink').addEventListener('click', async () => {
            const email = $('loginEmail').value.trim(); 
            const errorMsg = $('loginError'); 
            const btn = $('btnSendMagicLink');
            
            if (!supabaseClient) { errorMsg.textContent = 'Lỗi tải thư viện.'; errorMsg.style.display = 'block'; return; }
            if (!email) { errorMsg.textContent = "Vui lòng nhập email!"; errorMsg.style.display = 'block'; return; }
            
            btn.textContent = "Đang gửi..."; btn.disabled = true; errorMsg.style.display = 'none';
            
            const { error } = await supabaseClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } });
            
            if (error) { 
                errorMsg.textContent = error.message; errorMsg.style.display = 'block'; 
                btn.textContent = "Gửi link đăng nhập qua Email"; btn.disabled = false; 
            } else { 
                alert("Đã gửi link! Vui lòng kiểm tra hộp thư (hoặc mục Spam)."); 
                btn.textContent = "Gửi link đăng nhập qua Email"; btn.disabled = false; 
            }
        });

        // 5. ĐĂNG NHẬP BẰNG GOOGLE
        async function signInWithGoogle() {
            if (!supabaseClient) return;
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://thandanh83-sys.github.io/Prompt/profile.html' }
            });
            if (error) alert("Lỗi đăng nhập Google: " + error.message);
        }

        // 6. ĐĂNG XUẤT
        async function logout() {
            if (supabaseClient) { await supabaseClient.auth.signOut(); }
            window.location.reload();
        }
        $('btnLogoutMain').addEventListener('click', logout);
        $('btnLogoutHeader').addEventListener('click', logout);

        // Dropdown Avatar
        $('btnAvatar').addEventListener('click', (e) => { e.stopPropagation(); $('avatarDropdown').classList.remove('hidden'); setTimeout(() => $('avatarDropdown').classList.remove('opacity-0', 'scale-95'), 10); });
        document.addEventListener('click', () => { if (!$('avatarDropdown').classList.contains('hidden')) { $('avatarDropdown').classList.add('opacity-0', 'scale-95'); setTimeout(() => $('avatarDropdown').classList.add('hidden'), 200); } });

        // 7. LỊCH SỬ LOCALSTORAGE
        function loadHistory() {
            const list = $('historyList');
            let history = [];
            try {
                const stored = JSON.parse(localStorage.getItem('myPromptHistory') || '[]');
                if (Array.isArray(stored)) history = stored;
            } catch (error) {
                list.innerHTML = '<p class="text-center text-sm text-red-500 py-6">Không thể đọc lịch sử.</p>'; 
                return;
            }
            
            if (history.length === 0) {
                list.innerHTML = '<p class="text-center text-sm text-slate-500 py-6">Bạn chưa có lịch sử đánh giá nào trên thiết bị này.</p>';
                return; 
            }

            list.innerHTML = ''; 
            history.reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-4 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-slate-500">${escapeHtml(new Date(item.date).toLocaleString('vi-VN'))}</span>
                        <span class="text-sm font-bold text-pink-500">${escapeHtml(item.score)} điểm</span>
                    </div>
                    <p class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 truncate">${escapeHtml(item.prompt)}</p>
                `;
                list.appendChild(div);
            });
        }

        // 8. XUẤT / XÓA
        $('btnExport').addEventListener('click', () => {
            const data = localStorage.getItem('myPromptHistory') || '[]';
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `lich-su-prompt.json`; a.click(); URL.revokeObjectURL(url);
        });

        $('btnClearHistory').addEventListener('click', () => {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử trên máy này không?")) {
                localStorage.removeItem('myPromptHistory'); loadHistory();
            }
        });
    </script>
</body>
</html>
