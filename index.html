<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đánh giá Prompt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { transition: all 0.3s ease; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ec4899; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-100 text-slate-800 transition-colors duration-300" id="mainBody">
  
  <button id="themeToggle" class="fixed top-4 right-4 w-12 h-12 flex items-center justify-center rounded-full bg-white/50 backdrop-blur-md shadow-lg border border-white/50 text-2xl z-50">🌙</button>

  <div class="max-w-4xl mx-auto pt-10 px-4 pb-20">
    <h1 class="text-3xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-400">Hệ thống Đánh giá Prompt</h1>
    
    <div class="flex justify-center mb-8">
      <div class="flex bg-white/40 backdrop-blur-md rounded-full p-1 border border-white/50 shadow-sm">
        <button id="tabUser" class="px-8 py-2 rounded-full font-semibold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-md transition-all">User</button>
        <button id="tabAdmin" class="px-8 py-2 rounded-full font-semibold text-slate-600 hover:text-slate-900 transition-all">Admin</button>
      </div>
    </div>

    <!-- USER MODE -->
    <div id="userModeSection" class="block">
      <div class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6">
        <textarea id="promptInput" class="w-full h-32 p-4 rounded-2xl bg-white/60 border border-white/80 focus:outline-none focus:ring-2 focus:ring-pink-400 resize-none text-slate-800" placeholder="Nhập prompt cần đánh giá..."></textarea>
        <p id="errorMsg" class="text-red-500 text-sm mt-2 font-semibold" style="display: none;"></p>
        <button id="btnEvaluate" class="w-full mt-4 py-3 rounded-full font-bold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-lg hover:opacity-90 transition flex justify-center items-center">
            <span id="btnText">Đánh giá</span>
            <span id="btnLoader" class="loader" style="display: none;"></span>
        </button>
      </div>

      <div id="resultArea" class="mt-6 space-y-6" style="display: none;">
        <div class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6 flex justify-between items-center">
          <div>
            <p class="text-sm font-semibold text-slate-500 uppercase">Điểm tổng</p>
            <div class="flex items-baseline">
              <span id="totalScore" class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-400">0.0</span>
              <span class="text-2xl font-bold text-slate-400 ml-1">/ 10</span>
            </div>
          </div>
          <div class="text-right">
            <p class="text-sm font-semibold text-slate-500 uppercase mb-2">Phân loại</p>
            <span id="promptType" class="px-5 py-2 rounded-full font-bold text-white bg-gradient-to-r from-pink-500 to-blue-400 shadow-md">PROMPT</span>
          </div>
        </div>

        <div class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6">
          <h3 class="font-bold text-lg mb-4 text-slate-700">Danh sách lỗi</h3>
          <div id="errorList" class="space-y-2"></div>
        </div>

        <div class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6">
          <h3 class="font-bold text-lg mb-4 text-slate-700">Điểm từng tiêu chí</h3>
          <div id="criteriaList" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4"></div>
        </div>

        <div class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6 relative">
          <button id="btnCopyAll" class="absolute top-4 right-4 flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-500 bg-white/60 hover:bg-white/90 rounded-md border border-slate-200 transition-colors shadow-sm">
            <span id="copyBtnText">Sao chép</span>
          </button>
          <h3 class="font-bold text-lg mb-4 text-slate-700">Bản sửa</h3>
          <div id="rewriteList" class="space-y-3 text-sm pt-2"></div>
        </div>
      </div>
    </div>

    <!-- ADMIN MODE -->
    <div id="adminModeSection" style="display: none;">
      <div id="adminLoginBox" class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6 max-w-md mx-auto text-center" style="display: block;">
        <h3 class="font-bold text-lg mb-4 text-slate-700">Đăng nhập Admin</h3>
        <div class="relative w-full mb-4">
            <input type="password" id="adminPassword" class="w-full p-3 rounded-xl bg-white/60 border border-white/80 text-center pr-10 focus:outline-none focus:ring-2 focus:ring-pink-400 text-slate-800 font-medium" placeholder="Nhập mật khẩu...">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-xl text-slate-400 hover:text-slate-700 cursor-pointer">👁️</button>
        </div>
        <p id="adminError" class="text-red-500 text-sm font-semibold mb-4" style="display: none;">Sai mật khẩu. Vui lòng thử lại.</p>
        <button id="btnAdminLogin" class="w-full py-3 rounded-full font-bold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-lg hover:opacity-90 transition">Đăng nhập</button>
      </div>

      <div id="adminDashboard" class="glass-card bg-white/40 backdrop-blur-lg border border-white/60 shadow-xl rounded-3xl p-6 space-y-6" style="display: none;">
        <div class="flex justify-between items-center border-b border-white/50 pb-4">
          <h3 class="font-bold text-xl text-slate-700">🔧 CHI TIẾT NỘI BỘ</h3>
        </div>
        <div class="bg-white/60 p-4 rounded-xl border border-white/80 shadow-sm">
            <p class="text-sm text-slate-500 font-semibold mb-1">Prompt gần nhất:</p>
            <p id="adminLastPrompt" class="font-medium text-slate-800 break-words">Chưa có dữ liệu</p>
            <p class="text-sm text-slate-500 font-semibold mt-2">Điểm số: <span id="adminLastScore" class="text-xl font-bold text-pink-500">0.0</span></p>
        </div>
        <div class="flex gap-4 pt-2">
          <button id="btnAdminLogout" class="flex-1 py-3 rounded-full font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 transition">Đăng xuất</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// [CẤU HÌNH API RENDER - Đã xóa bỏ dấu Markdown]
const API_URL = "https://ho-tro-tao-prompt.onrender.com/evaluate";
let globalHistory = null;

// [TỪ ĐIỂN DỊCH MÃ LỖI] - Giải quyết vấn đề Backend trả về P01, P02...
const CRITERIA_NAMES = {
    "P01": "Độ rõ nhiệm vụ", "P02": "Đối tượng tác động", "P03": "Bối cảnh", "P04": "Định dạng đầu ra",
    "P05": "Độ chi tiết và ví dụ", "P06": "Không mơ hồ", "P07": "Không chung chung", "P08": "Có cấu trúc",
    "P09": "Phù hợp nhiệm vụ", "P10": "Chuyên môn có căn cứ", "P11": "Nhất quán lĩnh vực", "P12": "Yêu cầu khả thi",
    "P13": "Vai trò phù hợp", "P14": "Không mâu thuẫn",
    "T01": "Đủ mục", "T02": "Mục hợp lý", "T03": "Hướng dẫn điền", "T04": "Ví dụ mẫu", "T05": "Phân cấp",
    "T06": "Quy tắc cấm", "T07": "Quy tắc ưu tiên", "T08": "Quy trình xử lý", "T09": "Chất lượng placeholder",
    "M01": "Cấu trúc", "M02": "Chi tiết", "M03": "Định dạng", "M04": "Nhất quán", "M05": "Khả thi",
    "M06": "Vai trò", "M07": "Mở rộng", "M08": "Ứng dụng", "M09": "Quy trình"
};

// Hàm dịch mã (P01 -> Độ rõ nhiệm vụ)
function getCriteriaName(code) {
    return CRITERIA_NAMES[code] || code; 
}

// [XỬ LÝ ĐÁNH GIÁ - GỌI API THẬT & BẮT LỖI CHI TIẾT]
document.getElementById('btnEvaluate').addEventListener('click', async () => {
    let prompt = document.getElementById('promptInput').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const btnEval = document.getElementById('btnEvaluate');

    if (!prompt) { 
        errorMsg.textContent = 'Vui lòng nhập prompt!'; errorMsg.style.display = 'block'; return; 
    }
    errorMsg.style.display = 'none';

    // Trạng thái Loading
    btnEval.disabled = true;
    btnText.textContent = "Đang chấm điểm...";
    btnLoader.style.display = "inline-block";

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: prompt })
        });

        // Xử lý lỗi HTTP (500, 404, 422...)
        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.detail || `Lỗi từ máy chủ (${response.status})`);
        }

        const data = await response.json();
        
        // LƯU Ý: Cấu trúc data dưới đây phụ thuộc vào Backend.
        // Nếu Backend trả về { "scores": { "P01": 8 } }, bạn sửa 'details' thành 'scores'.
        globalHistory = data;

        // 1. Render Điểm tổng
        document.getElementById('totalScore').textContent = data.total || "0.0";
        document.getElementById('promptType').textContent = data.type || "PROMPT";

        // 2. Render Tiêu chí (Dùng DOM API chống XSS)
        const criteriaList = document.getElementById('criteriaList');
        criteriaList.replaceChildren();
        let errHTMLNodes = [];
        
        // Xử lý linh hoạt nếu API trả về details hoặc criteria
        const detailsObj = data.details || data.criteria || {};

        Object.entries(detailsObj).forEach(([code, score]) => {
            const realName = getCriteriaName(code); // Dịch P01 -> Tên tiếng Việt
            
            const div = document.createElement('div');
            const flexDiv = document.createElement('div'); flexDiv.className = 'flex justify-between text-sm font-semibold mb-1';
            
            const spanName = document.createElement('span'); spanName.textContent = realName; 
            const spanScore = document.createElement('span'); spanScore.textContent = `${score}/10`;
            
            flexDiv.appendChild(spanName); flexDiv.appendChild(spanScore);
            
            const barBg = document.createElement('div'); barBg.className = 'w-full bg-slate-200/50 rounded-full h-2';
            const barFill = document.createElement('div'); 
            barFill.className = score < 6 ? 'h-2 rounded-full bg-gradient-to-r from-pink-600 to-pink-400' : 'h-2 rounded-full bg-gradient-to-r from-blue-600 to-blue-400';
            barFill.style.width = `${score * 10}%`;
            
            barBg.appendChild(barFill); div.appendChild(flexDiv); div.appendChild(barBg);
            criteriaList.appendChild(div);

            // Thu thập lỗi
            if (score < 6) {
                const errDiv = document.createElement('div');
                errDiv.className = 'text-sm text-red-600 bg-red-50/50 p-3 rounded-xl border border-red-100 mb-2';
                const strong = document.createElement('strong');
                strong.textContent = `Tiêu chí ${realName} còn yếu (${score}/10)`;
                errDiv.appendChild(strong); errDiv.appendChild(document.createTextNode(', nên bổ sung thêm.'));
                errHTMLNodes.push(errDiv);
            }
        });

        // 3. Render Danh sách lỗi
        const errorList = document.getElementById('errorList');
        errorList.replaceChildren();
        if (errHTMLNodes.length === 0) {
            const p = document.createElement('p'); p.className = 'text-sm text-green-600 font-semibold'; p.textContent = 'Không có lỗi đáng kể.'; errorList.appendChild(p);
        } else {
            errHTMLNodes.forEach(node => errorList.appendChild(node));
        }

        // 4. Render Bản sửa
        const rewriteList = document.getElementById('rewriteList');
        rewriteList.replaceChildren();
        if (data.rewrite) {
            Object.entries(data.rewrite).forEach(([section, content]) => {
                const card = document.createElement('div'); card.className = 'p-3 bg-white/50 rounded-xl border border-white/60 mb-2';
                const heading = document.createElement('p'); heading.className = 'font-bold text-pink-500 mb-1'; heading.textContent = section;
                const text = document.createElement('p'); text.className = 'text-slate-700'; text.textContent = content; // Chống XSS
                card.appendChild(heading); card.appendChild(text); rewriteList.appendChild(card);
            });
        }

        document.getElementById('resultArea').style.display = 'block';

    } catch (error) {
        // Bắt lỗi chi tiết
        if (error.name === 'TypeError' && error.message.includes('fetch')) {
            errorMsg.textContent = "Lỗi kết nối mạng hoặc Backend chưa bật CORS!";
        } else {
            errorMsg.textContent = error.message;
        }
        errorMsg.style.display = 'block';
    } finally {
        // Tắt Loading
        btnEval.disabled = false;
        btnText.textContent = "Đánh giá";
        btnLoader.style.display = "none";
    }
});

// CÁC HÀM UI KHÁC (Copy, Admin, Sáng/Tối)
document.getElementById('btnCopyAll').addEventListener('click', () => {
    if (!globalHistory || !globalHistory.rewrite) return alert("Chưa có dữ liệu!");
    let textToCopy = "=== BẢN SỬA PROMPT ===\n\n";
    Object.entries(globalHistory.rewrite).forEach(([sec, content]) => { textToCopy += `${sec}:\n${content}\n\n`; });
    navigator.clipboard.writeText(textToCopy).then(() => { alert("Đã sao chép!"); }).catch(err => alert("Lỗi copy: " + err));
});

document.getElementById('togglePassword').addEventListener('click', function() {
    const pwdInput = document.getElementById('adminPassword');
    if (pwdInput.type === 'password') { pwdInput.type = 'text'; this.innerText = '🙈'; } else { pwdInput.type = 'password'; this.innerText = '👁️'; }
});

document.getElementById('btnAdminLogin').addEventListener('click', () => {
    let pwd = document.getElementById('adminPassword').value.trim();
    if (pwd === "bisdo091121") {
        document.getElementById('adminLoginBox').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        if (globalHistory) {
            document.getElementById('adminLastPrompt').textContent = globalHistory.prompt || "N/A";
            document.getElementById('adminLastScore').textContent = globalHistory.total || "0.0";
        }
    } else {
        document.getElementById('adminError').style.display = 'block';
    }
});

document.getElementById('btnAdminLogout').addEventListener('click', () => {
    document.getElementById('adminDashboard').style.display = 'none';
    document.getElementById('adminLoginBox').style.display = 'block';
    document.getElementById('adminPassword').value = '';
});

document.getElementById('tabUser').addEventListener('click', () => {
    document.getElementById('userModeSection').style.display = 'block';
    document.getElementById('adminModeSection').style.display = 'none';
});
document.getElementById('tabAdmin').addEventListener('click', () => {
    document.getElementById('userModeSection').style.display = 'none';
    document.getElementById('adminModeSection').style.display = 'block';
});
</script>
</body>
</html>
