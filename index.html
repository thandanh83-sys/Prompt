<head>

    <meta name="theme-color" content="#f8f7fc">
    <title>Trợ lý AI - Tối ưu hoá Prompt</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

    <script>
        if (window.location.hash === '#features') { history.replaceState(null, null, window.location.pathname); }
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);

        let savedTheme = null;
        try { savedTheme = window.localStorage.getItem('theme'); } catch (error) { }
        const useDarkTheme = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', useDarkTheme);
        document.documentElement.classList.toggle('light', !useDarkTheme);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <style>
        /* XỬ LÝ NỀN VÀ HÀO QUANG */
        html { background-color: #f8f7fc; transition: background-color .15s ease; min-height: 100vh; min-height: 100dvh; scroll-behavior: smooth; }
        html.dark { background-color: #0b1120 !important; }
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; background-color: transparent !important; overscroll-behavior-y: none; min-height: 100vh; min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); }
        
        .page-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: #f8f7fc; background-image: radial-gradient(circle at 50% -10%, rgba(236,72,153,0.15) 0%, transparent 60%), radial-gradient(circle at 50% 110%, rgba(59,130,246,0.15) 0%, transparent 60%); }
        html.dark .page-bg { background-color: #0b1120; background-image: radial-gradient(ellipse at 50% 0%, rgba(236, 72, 153, 0.5) 0%, rgba(168, 85, 247, 0.3) 40%, transparent 70%), radial-gradient(ellipse at 50% 100%, rgba(59, 130, 246, 0.5) 0%, transparent 70%); }

        .app-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-color: rgba(0,0,0,.06); transition: all .2s; }
        .dark .app-header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-color: rgba(255,255,255,.1); }
        
        .brand-text { 
            background: linear-gradient(100deg, #ec4899, #a052c8 52%, #3979f5); 
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent; 
            line-height: 1.2;
        }
        .btn-glow { box-shadow: 0 4px 20px rgba(236,72,153,.3); transition: all .2s ease; }
        .btn-glow:hover { box-shadow: 0 6px 25px rgba(59,130,246,.5); transform: translateY(-2px); }
        
        /* CSS MENU CHUẨN */
        .menu-dropdown { transition: all .2s ease-in-out; transform-origin: top left; width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 100px); overflow-y: auto; box-sizing: border-box; z-index: 9999 !important; }

        /* ============================================================
           CSS CHÍNH (PC VÀ MOBILE)
           ============================================================ */
        .feature-wrapper { cursor: pointer; transition: all 0.4s ease; }
        
        .feature-header {
            position: relative;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            transition: all 0.4s ease;
        }
        .dark .feature-header {
            background-color: #1e293b;
            border-color: #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        
        @media (min-width: 1024px) {
            .feature-wrapper:hover .feature-header { 
                transform: translateY(-2px); 
                border-color: rgba(236,72,153,0.3); 
                box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); 
            }
            .dark .feature-wrapper:hover .feature-header { 
                border-color: rgba(59,130,246,0.3); 
                box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); 
            }
        }

        .expand-icon { transition: transform 0.4s ease, color 0.4s ease; }
        .feature-wrapper.active .expand-icon { transform: rotate(180deg); color: #ec4899; }

        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 1.5s cubic-bezier(0.1, 0.9, 0.2, 1);
            will-change: grid-template-rows;
        }
        .feature-wrapper.active .accordion-content { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }

        .child-card {
            background-color: #ffffff; 
            border: 1px solid #f1f5f9; 
            border-radius: 1rem; 
            box-shadow: 0 2px 4px -1px rgba(0,0,0,0.02);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            transition-delay: 0s; 
            margin-left: 1.5rem; margin-right: 1.5rem; margin-bottom: 0.75rem;
        }
        .dark .child-card {
            background-color: #1e293b;
            border-color: #475569; 
            box-shadow: 0 2px 4px -1px rgba(0,0,0,0.2);
        }
        .feature-wrapper.active .child-card { opacity: 1; transform: translateY(0); }
        
        @media (min-width: 1024px) {
            .feature-wrapper.active .accordion-inner > div > .child-card:nth-child(1) { transition-delay: 1.1s; }
            .feature-wrapper.active .accordion-inner > div > .child-card:nth-child(2) { transition-delay: 1.2s; }
            .feature-wrapper.active .accordion-inner > div > .child-card:nth-child(3) { transition-delay: 1.3s; }
            .child-card:hover { background-color: #f8fafc; border-color: rgba(236,72,153,0.4); transform: translateX(4px) !important; }
            .dark .child-card:hover { background-color: #0f172a; border-color: rgba(59,130,246,0.4); }
        }

        /* ============================================================
           HIỆU ỨNG POWERPOINT (FOCUS MODE)
           ============================================================ */
        @media (min-width: 1024px) {
            #features.has-active > .feature-wrapper:not(.active) {
                opacity: 0; transform: scale(0.95); pointer-events: none; position: absolute; visibility: hidden; transition: opacity 0.4s ease, transform 0.4s ease;
            }
            #features.has-active > .feature-wrapper.active {
                grid-column: 1 / -1; max-width: 1000px; margin: 0 auto; width: 100%; animation: slideInSmooth 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; will-change: transform, opacity;
            }
            #features.has-active > .feature-wrapper.active .accordion-inner > div {
                display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding-top: 1.5rem;
            }
            #features.has-active > .feature-wrapper.active .child-card {
                margin-left: 0 !important; margin-right: 0 !important; margin-bottom: 0 !important;
            }
        }

        @keyframes slideInSmooth {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           TỐI ƯU GIAO DIỆN MOBILE (BÁM SÁT ẢNH 1)
           ============================================================ */
        @media (max-width: 640px) {
            .app-header .px-3 { padding-left: 0.5rem; padding-right: 0.5rem; }
            .app-header a[href="./landing.html"] { padding: 6px 12px !important; font-size: 12px !important; }
            main { padding-top: 4.5rem !important; }
            
            h1 { font-size: clamp(1.8rem, 6.5vw, 2.2rem) !important; line-height: 1.25 !important; margin-bottom: 1rem !important; text-align: center !important; }
            h1 span { white-space: nowrap !important; }
            
            p.text-lg { font-size: 0.875rem !important; margin-bottom: 1.5rem !important; line-height: 1.6 !important; text-align: center !important; }
            
            .max-w-lg { padding-left: 1rem !important; padding-right: 1rem !important; }
            .rounded-\[2rem\] { border-radius: 1.5rem !important; padding: 1rem !important; }
            .bg-\[\#ff5f56\], .bg-\[\#ffbd2e\], .bg-\[\#27c93f\] { width: 10px !important; height: 10px !important; }
            .h-\[120px\] { height: 90px !important; padding: 0.75rem !important; }
            .text-\[4\.5rem\] { font-size: 3.5rem !important; }
            
            .feature-header { padding: 1.25rem !important; border-radius: 1.5rem !important; }
            .feature-header .w-14 { width: 3rem !important; height: 3rem !important; border-radius: 1rem !important; }
            .feature-header .w-7 { width: 1.5rem !important; height: 1.5rem !important; }
            .feature-header h3 { font-size: 1.35rem !important; margin-bottom: 0.25rem !important; }
            .feature-header p { font-size: 0.9rem !important; }

            .child-card { 
                margin-left: 1rem !important; margin-right: 1rem !important; margin-bottom: 0.5rem !important;
                padding: 0.75rem 0.875rem !important; border-radius: 1rem !important; 
            }
            .child-card > div:first-child { width: 1.5rem !important; height: 1.5rem !important; margin-top: 0 !important; }
            .child-card > div:first-child span { font-size: 0.7rem !important; }
            .child-card h4 { font-size: 0.85rem !important; margin-bottom: 0.125rem !important; line-height: 1.3 !important; }
            .child-card p { font-size: 0.75rem !important; line-height: 1.4 !important; }

            .feature-wrapper.active .child-card:nth-child(1) { transition-delay: 1.1s; }
            .feature-wrapper.active .child-card:nth-child(2) { transition-delay: 1.2s; }
            .feature-wrapper.active .child-card:nth-child(3) { transition-delay: 1.3s; }

            #features { gap: 1rem !important; padding-left: 1rem !important; padding-right: 1rem !important; }
            .p-10 { padding: 1.5rem !important; }
            .text-3xl { font-size: 1.5rem !important; }
            .px-10 { padding-left: 1.5rem !important; padding-right: 1.5rem !important; font-size: 1rem !important; }
            
            .btn-hero { 
                padding: 0.75rem 1.5rem !important; 
                font-size: 1rem !important; 
                width: 100% !important;
                max-width: 260px;
                margin-left: auto !important;
                margin-right: auto !important;
            }
        }
    </style>
</head>
