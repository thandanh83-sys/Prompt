<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ lý tối ưu hoá Prompt</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glass-card { transition: all 0.3s ease; }
        .pre-wrap { white-space: pre-wrap; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark-glow { background: radial-gradient(circle at 50% 0%, rgba(236,72,153,0.15) 0%, transparent 60%); }
        .btn-glow { box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }
        .btn-glow:hover { box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); transform: translateY(-1px); }
        .stat-card { background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(255,255,255,0.1); }
        .dark .stat-card { background: linear-gradient(135deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.8) 100%); border: 1px solid rgba(51,65,85,0.5); }
        .menu-dropdown { transition: all 0.2s ease-in-out; transform-origin: top left; }
    </style>
</head>
<body class="antialiased min-h-screen relative text-slate-800 dark:text-slate-100 transition-colors duration-300 bg-slate-50 dark:bg-slate-900 dark-glow flex flex-col">

    <!-- HEADER CỐ ĐỊNH -->
    <header class="fixed top-0 left-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/50">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- TRÁI: MENU -->
            <div class="relative">
                <button id="btnHamburger" class="w-10 h-10 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
                
                <!-- MENU XỔ XUỐNG -->
                <div id="dropdownMenu" class="menu-dropdown absolute top-12 left-0 bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl w-56 overflow-hidden hidden opacity-0 scale-95 z-50">
                    <div class="flex flex-col py-2">
                        <a href="./landing.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors text-left">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                            Trang chủ
                        </a>
                        <button id="menuBtnEvaluate" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 text-left transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
                            Đánh giá
                        </button>
                        <button id="menuBtnLibrary" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 text-left transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                            Thư viện
                        </button>
                        
                        <!-- NÚT ADMIN (MẶC ĐỊNH ẨN) -->
                        <div id="adminMenuDivider" class="h-px bg-slate-100 dark:bg-slate-700/50 mx-2 my-1" style="display: none;"></div>
                        <button id="menuBtnAdmin" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 text-left transition-colors" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                            Quản trị (Admin)
                        </button>
                    </div>
                </div>
            </div>
            <!-- GIỮA: LOGO -->
            <div class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500 pointer-events-none">Trợ lý AI</div>
            <!-- PHẢI: THEME -->
            <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-full text-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">🌙</button>
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH (Giữ nguyên toàn bộ phần thân như cũ) -->
    <div class="max-w-xl w-full mx-auto px-5 pt-24 pb-32 flex-grow flex flex-col" id="mainContainer">
        <!-- ... Toàn bộ nội dung User Mode, Library, Admin ... -->
        <!-- LƯU Ý: Mình không dán lại phần thân ở đây để bạn dễ nhìn, bạn giữ nguyên phần thân cũ nhé -->
        
        <!-- (BẠN GIỮ NGUYÊN PHẦN THÂN TỪ DÒNG <div class="text-center mb-8... ĐẾN HẾT PHẦN ADMIN MODE NHƯ CŨ) -->
        
    </div>

<!-- (GIỮ NGUYÊN MODAL VÀ CÁC SCRIPT KHÁC NHƯ CŨ) -->

<script>
    const API_URL = "https://prompt-tx2e.onrender.com"; 
    const SECTION_NAMES = ["1. VAI TRÒ", "2. BỐI CẢNH", "3. INPUT", "4. MỤC TIÊU", "5. YÊU CẦU", "6. RÀNG BUỘC", "7. TASK", "8. ĐỊNH DẠNG ĐẦU RA", "9. NEVER DO", "10. THỨ TỰ ƯU TIÊN", "11. XỬ LÝ NỘI BỘ"];
    const $ = id => document.getElementById(id);
    let lastResult = null;
    let adminToken = null;
    let chart1 = null;
    let chart2 = null;
    let isLibraryLoaded = false;

    // LOGIC MENU
    const btnHamburger = $('btnHamburger');
    const dropdownMenu = $('dropdownMenu');
    let isMenuOpen = false;

    btnHamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        isMenuOpen = !isMenuOpen;
        if (isMenuOpen) {
            dropdownMenu.classList.remove('hidden');
            setTimeout(() => { dropdownMenu.classList.remove('opacity-0', 'scale-95'); dropdownMenu.classList.add('opacity-100', 'scale-100'); }, 10);
        } else {
            dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200);
        }
    });

    document.addEventListener('click', (e) => {
        if (isMenuOpen && !dropdownMenu.contains(e.target) && e.target !== btnHamburger) {
            isMenuOpen = false; dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200);
        }
    });

    // Chuyển Tab
    $('menuBtnEvaluate').addEventListener('click', () => { switchToEvaluate(); btnHamburger.click(); });
    $('menuBtnLibrary').addEventListener('click', () => { switchToLibrary(); btnHamburger.click(); });
    $('menuBtnAdmin').addEventListener('click', () => { switchToAdmin(); btnHamburger.click(); });

    function switchToEvaluate() { $('userModeSection').style.display = 'block'; $('libraryModeSection').style.display = 'none'; $('adminModeSection').style.display = 'none'; }
    function switchToLibrary() { $('userModeSection').style.display = 'none'; $('libraryModeSection').style.display = 'block'; $('adminModeSection').style.display = 'none'; if (!isLibraryLoaded) { fetchLibrary(); } }
    function switchToAdmin() { $('userModeSection').style.display = 'none'; $('libraryModeSection').style.display = 'none'; $('adminModeSection').style.display = 'block'; if (adminToken) { $('adminLoginBox').style.display = 'none'; $('adminDashboard').style.display = 'block'; fetchHistory(); } else { $('adminLoginBox').style.display = 'block'; $('adminDashboard').style.display = 'none'; } }

    // CHECK ADMIN IP (Dành cho menu)
    async function checkAdminAccess() {
        try {
            const res = await fetch(`${API_URL}/check_admin_ip`);
            if (res.ok) { $('adminMenuDivider').style.display = 'block'; $('menuBtnAdmin').style.display = 'flex'; } 
            else { $('adminMenuDivider').style.display = 'none'; $('menuBtnAdmin').style.display = 'none'; }
        } catch (e) { $('adminMenuDivider').style.display = 'none'; $('menuBtnAdmin').style.display = 'none'; }
    }
    checkAdminAccess();

    // XỬ LÝ URL PARAMS (Để nhận diện khi từ landing.html bấm sang)
    const urlParams = new URLSearchParams(window.location.search);
    const tabParam = urlParams.get('tab');
    if (tabParam === 'library') { switchToLibrary(); }
    else if (tabParam === 'admin') { switchToAdmin(); }
    else { switchToEvaluate(); }

    // ... (CÁC HÀM XỬ LÝ THEME, ĐÁNH GIÁ, COPY, ADMIN DASHBOARD GIỮ NGUYÊN NHƯ FILE TRƯỚC CỦA BẠN) ...
</script>
</body>
</html>
