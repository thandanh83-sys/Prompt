<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý tối ưu hoá Prompt</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            transition: background-color .15s ease, color .15s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            body, .glass-card, .btn-glow { transition: none !important; animation: none !important; }
        }

        .glass-card { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
        .pre-wrap { white-space: pre-wrap; }
        #promptInput { white-space: pre-wrap; overflow-wrap: anywhere; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .dark-glow { background: #f8f7fc; }
        .dark.dark-glow { background: #0f172a; }

        .brand-spark { flex-shrink: 0; }
        .brand-text {
            background: linear-gradient(100deg, #ec4899, #a052c8 52%, #3979f5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-icon-gradient { fill: url(#brandSparkGradient); }

        .app-header { background: #fff; border-color: rgba(0,0,0,.06); }
        .dark .app-header { background: #0f172a; border-color: rgba(255,255,255,.1); }

        @media (min-width: 768px) {
            #mainContainer { max-width: 64rem; }
            #promptInput { min-height: 11rem; }
        }

        .btn-glow { box-shadow: 0 4px 15px rgba(236,72,153,.3); }
        .btn-glow:hover { box-shadow: 0 6px 20px rgba(59,130,246,.5); transform: translateY(-1px); }

        .stat-card { background: linear-gradient(135deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 100%); border: 1px solid rgba(255,255,255,.1); }
        .dark .stat-card { background: linear-gradient(135deg, rgba(30,41,59,.8) 0%, rgba(15,23,42,.8) 100%); border: 1px solid rgba(51,65,85,.5); }

        /* CSS CHO MENU CARD (HÌNH 1) */
        .menu-dropdown {
            transition: all .2s ease-in-out;
            transform-origin: top left;
            width: min(280px, calc(100vw - 32px));
            max-height: calc(100dvh - 100px);
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }
        @media (max-width: 640px) {
            .menu-dropdown { width: min(260px, calc(100vw - 32px)); max-height: calc(100dvh - 88px); }
        }

        .toast-msg {
            background-color: #1e293b; color: white; padding: 10px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,.1);
            opacity: 0; transform: translateY(20px); transition: all .3s ease;
            pointer-events: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .toast-success { border-left: 4px solid #22c55e; }
        .toast-error { border-left: 4px solid #ef4444; }
        .toast-show { opacity: 1; transform: translateY(0); }
    </style>
</head>

<body class="antialiased min-h-screen relative text-slate-800 dark:text-slate-100 transition-colors duration-300 bg-slate-50 dark:bg-slate-900 dark-glow flex flex-col">

    <!-- HEADER CỐ ĐỊNH -->
    <header class="app-header fixed top-0 left-0 w-full z-50 border-b">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-between gap-3">
            
            <!-- BÊN TRÁI: MENU & LOGO -->
            <div class="relative flex items-center gap-2">
                <button id="btnHamburger" class="w-10 h-10 shrink-0 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Mở menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- MENU XỔ XUỐNG (CARD NHƯ HÌNH 1) -->
                <div id="dropdownMenu" class="menu-dropdown absolute top-12 left-0 bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl hidden opacity-0 scale-95 z-50 p-2">
                    <div class="flex flex-col gap-1">
                        
                        <!-- Trang chủ (Icon Nhà - Hồng) -->
                        <a href="./landing.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                            </svg>
                            Trang chủ
                        </a>

                        <!-- Đánh giá (Icon Sao - Xanh dương) -->
                        <button id="menuBtnEvaluate" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 text-left transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                            </svg>
                            Đánh giá
                        </button>

                        <!-- Thư viện (Icon Sách - Tím) -->
                        <button id="menuBtnLibrary" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/50 text-sm font-semibold text-slate-700 dark:text-slate-200 text-left transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                            Thư viện
                        </button>

                        <!-- Phân cách -->
                        <div id="adminMenuDivider" class="h-px bg-slate-100 dark:bg-slate-700/50 my-1 mx-2" style="display:none;"></div>

                        <!-- Quản trị (Icon Bánh răng - Xanh lá) -->
                        <button id="menuBtnAdmin" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-green-50 dark:hover:bg-green-900/20 text-sm font-semibold text-green-600 dark:text-green-400 text-left transition-colors" style="display:none;">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Quản trị (Hiện tại)
                        </button>
                    </div>
                </div>
            </div>

            <!-- GIỮA: LOGO -->
            <div class="flex items-center gap-1.5 min-w-0">
                <svg class="brand-spark w-7 h-7" viewBox="0 0 24 24" aria-hidden="true">
                    <defs>
                        <linearGradient id="brandSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ec4899"/>
                            <stop offset="100%" stop-color="#3b82f6"/>
                        </linearGradient>
                    </defs>
                    <path class="brand-icon-gradient" d="M12 2L14.7 9.3 22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/>
                </svg>
                <span class="brand-text text-lg sm:text-xl font-extrabold truncate">Trợ lý AI</span>
            </div>

            <!-- BÊN PHẢI: NÚT THEME -->
            <button id="themeToggle" class="w-10 h-10 shrink-0 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Chuyển giao diện">
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH (GIỮ NGUYÊN NHƯ CŨ) -->
    <main class="w-full max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 md:pt-28 pb-32 flex-grow flex flex-col" id="mainContainer">
        <!-- (Toàn bộ nội dung user mode, library mode, admin mode, popup hướng dẫn, toast container giữ nguyên) -->
        <!-- ... -->
    </main>

    <!-- (Script giữ nguyên, chỉ cập nhật JS của menu) -->
    <script>
        // ... (Phần khai báo API_URL, SECTION_NAMES, biến toàn cục, hàm copy, showToast, logic user/library/admin giữ nguyên)
        
        // LOGIC MENU (ĐÃ ĐỒNG BỘ)
        const btnHamburger = $('btnHamburger');
        const dropdownMenu = $('dropdownMenu');
        let isMenuOpen = false;

        btnHamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                dropdownMenu.classList.remove('hidden');
                setTimeout(() => { dropdownMenu.classList.remove('opacity-0', 'scale-95'); dropdownMenu.classList.add('opacity-100', 'scale-100'); }, 10);
            } else {
                dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95');
                setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200);
            }
        });

        document.addEventListener('click', (e) => {
            if (isMenuOpen && !dropdownMenu.contains(e.target) && e.target !== btnHamburger) {
                isMenuOpen = false; dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95');
                setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200);
            }
        });
        // ... (Các logic click menuBtnEvaluate, Library, Admin giữ nguyên)
    </script>
</body>
</html>
