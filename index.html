<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống Đánh giá Prompt (v38)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<style>
  .glass-card { transition: all 0.3s ease; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }
</style>
</head>
<body>
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-100 text-slate-800 dark:from-slate-900 dark:to-slate-800 dark:text-slate-100 transition-colors duration-300">
  <button id="themeToggle" class="fixed top-4 right-4 w-12 h-12 flex items-center justify-center rounded-full bg-white/50 dark:bg-slate-800/60 backdrop-blur-md shadow-lg border border-white/50 dark:border-slate-700/60 text-2xl z-50 hover:scale-105 transition-transform">🌙</button>

  <div class="max-w-4xl mx-auto pt-10 px-4 pb-20">
    <h1 class="text-3xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-400">Hệ thống Đánh giá Prompt</h1>

    <div class="flex justify-center mb-8">
      <div class="flex bg-white/40 dark:bg-slate-800/60 backdrop-blur-md rounded-full p-1 border border-white/50 dark:border-slate-700/60 shadow-sm">
        <button id="tabUser" class="px-8 py-2 rounded-full font-semibold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-md transition-all">User</button>
        <button id="tabAdmin" class="px-8 py-2 rounded-full font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 transition-all">Admin</button>
      </div>
    </div>

    <div id="userModeSection">
      <div class="glass-card bg-white/40 dark:bg-slate-800/60 backdrop-blur-lg border border-white/60 dark:border-slate-700/60 shadow-xl rounded-3xl p-6">
        <textarea id="promptInput" class="w-full h-32 p-4 rounded-2xl bg-white/60 dark:bg-slate-900/60 border border-white/80 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-pink-400 resize-none text-slate-800 dark:text-slate-100" placeholder="Nhập prompt cần đánh giá..."></textarea>
        <p id="errorMsg" class="text-red-500 text-sm mt-2 font-semibold" style="display: none;">Vui lòng nhập prompt!</p>
        <button id="btnEvaluate" class="w-full mt-4 py-3 rounded-full font-bold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-lg hover:opacity-90 disabled:opacity-60 transition">Đánh giá</button>
      </div>

      <div id="resultArea" class="mt-6 space-y-6" style="display: none;">
        <div class="glass-card bg-white/40 dark:bg-slate-800/60 backdrop-blur-lg border border-white/60 dark:border-slate-700/60 shadow-xl rounded-3xl p-6 flex justify-between items-center">
          <div>
            <p class="text-sm font-semibold text-slate-500 uppercase">Điểm tổng</p>
            <div class="flex items-baseline">
              <span id="totalScore" class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-400">0.0</span>
              <span class="text-2xl font-bold text-slate-400 ml-1">/ 10</span>
            </div>
          </div>
          <div class="text-right">
            <p class="text-sm font-semibold text-slate-500 uppercase mb-2">Phân loại</p>
            <span id="promptType" class="px-5 py-2 rounded-full font-bold text-white bg-gradient-to-r from-pink-500 to-blue-400 shadow-md">PROMPT</span>
          </div>
        </div>

        <div class="glass-card bg-white/40 dark:bg-slate-800/60 backdrop-blur-lg border border-white/60 dark:border-slate-700/60 shadow-xl rounded-3xl p-6">
          <h3 class="font-bold text-lg mb-4">Điểm từng tiêu chí</h3>
          <div id="criteriaList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div class="glass-card bg-white/40 dark:bg-slate-800/60 backdrop-blur-lg border border-white/60 dark:border-slate-700/60 shadow-xl rounded-3xl p-6 relative">
          <button id="btnCopyAll" class="absolute top-4 right-4 flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-white/60 dark:bg-slate-900/60 rounded-md border border-slate-200 shadow-sm">
            <span id="copyBtnText">Sao chép</span>
          </button>
          <h3 class="font-bold text-lg mb-4">Bản sửa (11 mục)</h3>
          <div id="rewriteList" class="space-y-3 text-sm pt-2"></div>
        </div>
      </div>
    </div>

    <div id="adminModeSection" style="display: none;">
      <div id="adminLoginBox" class="glass-card bg-white/40 dark:bg-slate-800/60 backdrop-blur-lg border border-white/60 dark:border-slate-700/60 shadow-xl rounded-3xl p-6 max-w-md mx-auto text-center">
        <h3 class="font-bold text-lg mb-4">Đăng nhập Admin</h3>
        <input type="password" id="adminPassword" class="w-full p-3 rounded-xl bg-white/60 dark:bg-slate-900/60 border border-white/80 dark:border-slate-700 text-center mb-4" placeholder="Mật khẩu...">
        <p id="adminError" class="text-red-500 text-sm font-semibold mb-4" style="display: none;">Sai mật khẩu. Vui lòng thử lại.</p>
        <button id="btnAdminLogin" class="w-full py-3 rounded-full font-bold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-lg">Đăng nhập</button>
      </div>

      <div id="adminDashboard" class="glass-card bg-white/40 dark:bg-slate-800/60 backdrop-blur-lg border border-white/60 dark:border-slate-700/60 shadow-xl rounded-3xl p-6 space-y-6" style="display: none;">
        <h3 class="font-bold text-xl border-b border-slate-200 dark:border-slate-700 pb-4">🔧 CHI TIẾT NỘI BỘ</h3>
        <div class="bg-white/60 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
            <p class="text-sm text-slate-500 mb-1">Prompt gần nhất:</p>
            <p id="adminLastPrompt" class="font-medium break-words">Chưa có dữ liệu</p>
            <p class="text-sm mt-2">Điểm: <span id="adminLastScore" class="font-bold text-pink-500 text-xl">0.0</span> | Loại: <span id="adminLastType" class="font-bold text-blue-500">PROMPT</span></p>
        </div>
        <div class="flex gap-4 pt-2">
          <button id="btnAdminLogout" class="flex-1 py-3 rounded-full font-bold bg-slate-200 dark:bg-slate-700">Đăng xuất</button>
          <button id="btnClearHistory" class="flex-1 py-3 rounded-full font-bold bg-red-100 text-red-600">Xóa lịch sử</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://ho-tro-tao-prompt.onrender.com/evaluate"; 
const SECTION_NAMES = ["1. VAI TRÒ", "2. BỐI CẢNH", "3. INPUT", "4. MỤC TIÊU", "5. YÊU CẦU", "6. RÀNG BUỘC", "7. TASK", "8. ĐỊNH DẠNG ĐẦU RA", "9. NEVER DO", "10. THỨ TỰ ƯU TIÊN", "11. XỬ LÝ NỘI BỘ"];
const $ = id => document.getElementById(id);
let lastResult = null;

function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  $('themeToggle').textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
}
(function initTheme() {
  let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
})();
$('themeToggle').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

// Hàm gọi API có Timeout (Không bao giờ bị treo)
async function evaluatePrompt(prompt) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 giây

  try {
    const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt }),
        signal: controller.signal
    });
    clearTimeout(timeoutId);
    
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    if (!response.ok) throw new Error("Lỗi HTTP: " + response.status);
    return data;
  } catch (error) {
    clearTimeout(timeoutId);
    if (error.name === 'AbortError') {
        throw new Error("Quá thời gian chờ (60s). Server Render có thể đang khởi động, vui lòng bấm lại!");
    }
    throw error;
  }
}

function render(r) {
  $('totalScore').textContent = r.total;
  $('promptType').textContent = r.type;

  const list = $('criteriaList'); list.replaceChildren();
  Object.entries(r.details).forEach(([name, score]) => {
    const weak = score < 6;
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="flex justify-between text-sm font-semibold mb-1">
        <span>${name}</span>
        <span class="${weak ? 'text-pink-500' : ''}">${score}/10</span>
      </div>
      <div class="w-full bg-slate-200/50 dark:bg-slate-700/50 rounded-full h-2">
        <div class="h-2 rounded-full bg-gradient-to-r ${weak ? 'from-pink-600 to-pink-400' : 'from-blue-600 to-blue-400'}" style="width: ${score * 10}%"></div>
      </div>`;
    list.append(row);
  });

  const rw = $('rewriteList'); rw.replaceChildren();
  SECTION_NAMES.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'p-3 bg-white/50 dark:bg-slate-900/50 rounded-xl border border-white/60 dark:border-slate-700/60';
    card.innerHTML = `<p class="font-bold text-pink-500 mb-1">${sec}</p><p class="text-slate-700 dark:text-slate-200 break-words">${r.rewrite[sec] || ''}</p>`;
    rw.append(card);
  });
  
  $('resultArea').style.display = 'block';
  $('adminLastPrompt').innerText = r.prompt;
  $('adminLastScore').innerText = r.total;
  $('adminLastType').innerText = r.type;
}

$('btnEvaluate').addEventListener('click', async () => {
  const prompt = $('promptInput').value.trim();
  if (!prompt) { $('errorMsg').style.display = 'block'; return; }
  $('errorMsg').style.display = 'none';
  
  const btn = $('btnEvaluate');
  btn.disabled = true; btn.textContent = 'AI Đang chấm điểm (vui lòng đợi)...';
  
  try {
    lastResult = await evaluatePrompt(prompt);
    render(lastResult);
  } catch (e) {
    $('errorMsg').textContent = e.message; 
    $('errorMsg').style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Đánh giá';
  }
});

$('btnCopyAll').addEventListener('click', async () => {
  if (!lastResult) return;
  let text = "=== BẢN SỬA PROMPT ===\n\n";
  SECTION_NAMES.forEach(s => { text += `${s}:\n${lastResult.rewrite[s]}\n\n`; });
  try {
    await navigator.clipboard.writeText(text);
    $('copyBtnText').textContent = 'Đã chép!'; $('copyBtnText').classList.add('text-green-500');
  } catch (e) {}
  setTimeout(() => { $('copyBtnText').textContent = 'Sao chép'; $('copyBtnText').classList.remove('text-green-500'); }, 2000);
});

$('btnAdminLogin').addEventListener('click', () => {
  if ($('adminPassword').value.trim() === "bisdo091121") {
    $('adminLoginBox').style.display = 'none'; $('adminDashboard').style.display = 'block';
  } else { $('adminError').style.display = 'block'; }
});
$('btnAdminLogout').addEventListener('click', () => {
  $('adminLoginBox').style.display = 'block'; $('adminDashboard').style.display = 'none'; $('adminPassword').value = '';
});
$('btnClearHistory').addEventListener('click', () => {
  $('adminLastPrompt').innerText = "Chưa có dữ liệu"; $('adminLastScore').innerText = "0.0";
});

$('tabUser').addEventListener('click', () => {
  $('userModeSection').style.display = 'block'; $('adminModeSection').style.display = 'none';
  $('tabUser').className = "px-8 py-2 rounded-full font-semibold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-md";
  $('tabAdmin').className = "px-8 py-2 rounded-full font-semibold text-slate-600 dark:text-slate-400";
});
$('tabAdmin').addEventListener('click', () => {
  $('userModeSection').style.display = 'none'; $('adminModeSection').style.display = 'block';
  $('tabAdmin').className = "px-8 py-2 rounded-full font-semibold bg-gradient-to-r from-pink-500 to-blue-400 text-white shadow-md";
  $('tabUser').className = "px-8 py-2 rounded-full font-semibold text-slate-600 dark:text-slate-400";
});
</script>
</body>
</html>
