<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Trợ lý AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background-color .15s ease; }
        .glass-card { transition: transform .2s ease; }
        .dark-glow { background: radial-gradient(ellipse at 18% 10%, rgba(229,112,196,.16) 0%, transparent 38%), #f8f7fc; }
        .dark.dark-glow { background: radial-gradient(ellipse at 18% 10%, rgba(164,55,130,.13) 0%, transparent 38%), #0f172a; }
        .brand-text { background: linear-gradient(100deg, #e743a3, #a052c8 52%, #3979f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .app-header { background: #fff; border-color: rgba(0,0,0,.06); } .dark .app-header { background: #0f172a; border-color: rgba(255,255,255,.1); }
        .menu-dropdown { transition: all .2s; transform-origin: top left; width: min(290px, calc(100vw - 24px)); }
        .stat-card { background: linear-gradient(135deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 100%); border: 1px solid rgba(255,255,255,.1); }
        .dark .stat-card { background: linear-gradient(135deg, rgba(30,41,59,.8) 0%, rgba(15,23,42,.8) 100%); border: 1px solid rgba(51,65,85,.5); }
    </style>
</head>
<body class="antialiased min-h-screen relative text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 dark-glow flex flex-col">
    <header class="app-header fixed top-0 left-0 w-full z-50 border-b">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <div class="relative flex items-center">
                <button id="btnHamburger" class="w-10 h-10 flex items-center justify-center rounded-full text-slate-600 dark:text-slate-300"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                <div id="dropdownMenu" class="menu-dropdown absolute top-12 left-0 bg-white dark:bg-[#1e293b] border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl hidden opacity-0 scale-95 z-50">
                    <div class="flex flex-col py-2">
                        <a href="./index.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 text-sm font-semibold">🏠 Trang chủ</a>
                        <a href="./landing.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 text-sm font-semibold">⚡ Đánh giá</a>
                        <a href="./library.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 text-sm font-semibold">📚 Thư viện</a>
                        <a href="./admin.html" class="flex items-center gap-3 px-4 py-3 bg-slate-50 dark:bg-slate-700/50 text-sm font-semibold text-green-500">⚙️ Quản trị (Hiện tại)</a>
                    </div>
                </div>
            </div>
            <a href="./index.html" class="flex items-center gap-2"><svg class="w-7 h-7" viewBox="0 0 24 24"><defs><linearGradient id="brandSparkGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><path fill="url(#brandSparkGradient)" d="M12 2L14.7 9.3 22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></svg><span class="brand-text text-lg font-extrabold">Trợ lý AI</span></a>
            <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300"><svg id="themeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
        </div>
    </header>

    <main class="w-full max-w-3xl mx-auto px-4 pt-24 pb-32 flex-grow flex flex-col">
        <div id="adminLoginBox" class="glass-card bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 shadow-sm rounded-3xl p-6 max-w-sm mx-auto text-center relative mt-10">
            <h3 class="font-bold text-xl mb-6">Đăng nhập Quản trị</h3>
            <div class="relative w-full mb-4"><input type="password" id="adminPassword" class="w-full p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 text-center text-sm focus:ring-pink-500" placeholder="Mật khẩu..."></div>
            <p id="adminError" class="text-red-500 text-xs font-semibold mb-4 hidden">Sai mật khẩu hoặc lỗi kết nối.</p>
            <button id="btnAdminLogin" class="w-full py-3.5 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition text-sm">Đăng nhập</button>
        </div>

        <div id="adminDashboard" class="space-y-6 mt-4 hidden">
            <div class="flex justify-between items-end mb-2">
                <h3 class="font-bold text-2xl">Tổng quan</h3>
                <button id="btnAdminLogout" class="text-xs font-semibold text-slate-500 hover:text-red-500">Đăng xuất</button>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div class="stat-card rounded-2xl p-4 flex flex-col items-center"><p class="text-[10px] font-bold text-slate-500 uppercase">Lượt đánh giá</p><p id="statTotal" class="text-2xl font-extrabold text-blue-500">0</p></div>
                <div class="stat-card rounded-2xl p-4 flex flex-col items-center"><p class="text-[10px] font-bold text-slate-500 uppercase">Điểm TB</p><p id="statAvg" class="text-2xl font-extrabold text-pink-500">0.0</p></div>
                <div class="stat-card rounded-2xl p-4 flex flex-col items-center"><p class="text-[10px] font-bold text-slate-500 uppercase">Prompt Sạch</p><p id="statClean" class="text-2xl font-extrabold text-green-500">0%</p></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="stat-card rounded-2xl p-5"><p class="text-xs font-bold text-slate-500 mb-2 text-center uppercase">Lỗi Phổ Biến</p><div class="h-48"><canvas id="errorChart"></canvas></div></div>
                <div class="stat-card rounded-2xl p-5"><p class="text-xs font-bold text-slate-500 mb-2 text-center uppercase">Phân Bố Điểm</p><div class="h-48"><canvas id="scoreChart"></canvas></div></div>
            </div>
            <div class="stat-card rounded-2xl overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-700/50 bg-slate-800/30"><p class="text-xs font-bold text-slate-300 uppercase">Lịch sử</p></div>
                <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
                    <table class="w-full text-xs text-left relative">
                        <thead class="text-[10px] text-slate-400 uppercase bg-slate-900/80 sticky top-0 z-10"><tr><th class="px-4 py-3">Thời gian</th><th class="px-4 py-3">Prompt</th><th class="px-4 py-3">Điểm</th><th class="px-4 py-3">Lỗi</th></tr></thead>
                        <tbody id="adminHistoryList"><tr><td colspan="4" class="text-center py-6">Đang tải...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

<script>
    const API_URL = "https://prompt-tx2e.onrender.com"; 
    const $ = id => document.getElementById(id);
    let adminToken = null, chart1 = null, chart2 = null;

    const btnHamburger = $('btnHamburger'), dropdownMenu = $('dropdownMenu'); let isMenuOpen = false;
    btnHamburger.addEventListener('click', (e) => { e.stopPropagation(); isMenuOpen = !isMenuOpen; if (isMenuOpen) { dropdownMenu.classList.remove('hidden'); setTimeout(() => { dropdownMenu.classList.remove('opacity-0', 'scale-95'); dropdownMenu.classList.add('opacity-100', 'scale-100'); }, 10); } else { dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95'); setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200); } });
    document.addEventListener('click', (e) => { if (isMenuOpen && !dropdownMenu.contains(e.target) && e.target !== btnHamburger) { isMenuOpen = false; dropdownMenu.classList.remove('opacity-100', 'scale-100'); dropdownMenu.classList.add('opacity-0', 'scale-95'); setTimeout(() => { dropdownMenu.classList.add('hidden'); }, 200); } });

    const moonSVG = `<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>`;
    const sunSVG = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>`;
    function applyTheme(dark) { const root = document.documentElement; root.classList.toggle('dark', dark); $('themeIcon').innerHTML = dark ? sunSVG : moonSVG; try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} if(chart1 && chart2) updateChartsTheme(dark); }
    applyTheme(document.documentElement.classList.contains('dark'));
    $('themeToggle').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

    async function checkAdminAccess() {
        try {
            const res = await fetch(`${API_URL}/check_admin_ip`);
            if (!res.ok) { $('adminLoginBox').innerHTML = '<p class="text-red-500 font-bold">Bạn không có quyền truy cập (Sai IP).</p>'; }
        } catch (e) { console.log("Lỗi check IP"); }
    }
    checkAdminAccess();

    $('btnAdminLogin').addEventListener('click', async () => {
        const pwd = $('adminPassword').value.trim(); if (!pwd) return;
        try {
            const response = await fetch(`${API_URL}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
            const data = await response.json();
            if (response.ok && data.token) { adminToken = data.token; $('adminLoginBox').style.display = 'none'; $('adminDashboard').style.display = 'block'; fetchHistory(); } 
            else { $('adminError').style.display = 'block'; $('adminError').textContent = data.detail || "Sai mật khẩu."; }
        } catch (e) { $('adminError').style.display = 'block'; $('adminError').textContent = "Lỗi kết nối Server."; }
    });

    $('btnAdminLogout').addEventListener('click', () => { adminToken = null; $('adminDashboard').style.display = 'none'; $('adminLoginBox').style.display = 'block'; $('adminPassword').value = ''; });

    const ERROR_NAMES = { "A01": "Lỗi chính tả", "A02": "Thiếu dấu câu", "A03": "Lặp lại", "B01": "Thiếu cấu trúc", "B02": "Mục không logic", "B03": "Sai phân cấp", "B04": "Chưa định dạng", "C01": "Đối tượng chưa rõ", "C02": "Thiếu bối cảnh", "C03": "Chung chung", "C04": "Thiếu ví dụ", "D01": "Mâu thuẫn", "D02": "Bất khả thi", "D03": "Vai trò sai", "E01": "Trộn lĩnh vực", "E02": "Thuật ngữ lộn xộn", "E03": "Thiếu đặc thù" };
    
    function updateChartsTheme(isDark) {
        const textColor = isDark ? '#94a3b8' : '#64748b';
        [chart1, chart2].forEach(chart => { if (chart) { chart.options.plugins.legend.labels.color = textColor; chart.options.scales.x.ticks.color = textColor; chart.options.scales.y.ticks.color = textColor; chart.update(); } });
    }

    function updateStats(history) {
        if (!history || history.length === 0) return;
        $('statTotal').textContent = history.length;
        let totalScore = 0, cleanCount = 0;
        history.forEach(item => { totalScore += item.total_score; if (!item.errors || item.errors.length === 0) cleanCount++; });
        $('statAvg').textContent = (totalScore / history.length).toFixed(1);
        $('statClean').textContent = `${Math.round((cleanCount / history.length) * 100)}%`;
    }

    async function fetchHistory() {
        const tbody = $('adminHistoryList'); tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-500 text-xs">Đang tải...</td></tr>';
        try {
            const response = await fetch(`${API_URL}/history`, { method: 'GET', headers: { 'X-Admin-Token': adminToken } });
            const data = await response.json();
            if (response.ok && data.history) {
                tbody.replaceChildren(); updateStats(data.history);
                if (data.history.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-500 text-xs">Chưa có dữ liệu.</td></tr>'; return; }
                
                let errorCounts = {}, scoreDist = { '0-3': 0, '4-6': 0, '7-8': 0, '9-10': 0 };
                data.history.forEach(item => {
                    if (item.errors && item.errors.length > 0) item.errors.forEach(e => errorCounts[e.code] = (errorCounts[e.code] || 0) + 1);
                    let s = item.total_score; if (s <= 3) scoreDist['0-3']++; else if (s <= 6) scoreDist['4-6']++; else if (s <= 8) scoreDist['7-8']++; else scoreDist['9-10']++;
                });

                if (chart1) chart1.destroy();
                chart1 = new Chart($('errorChart').getContext('2d'), { type: 'doughnut', data: { labels: Object.keys(errorCounts).length ? Object.keys(errorCounts).map(c=>ERROR_NAMES[c]||c) : ['Sạch'], datasets: [{ data: Object.values(errorCounts).length ? Object.values(errorCounts) : [1], backgroundColor: Object.keys(errorCounts).length ? ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#8b5cf6'] : ['#22c55e'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b', font: {size: 10} } } } } });

                if (chart2) chart2.destroy();
                chart2 = new Chart($('scoreChart').getContext('2d'), { type: 'bar', data: { labels: Object.keys(scoreDist), datasets: [{ label: 'SL', data: Object.values(scoreDist), backgroundColor: '#ec4899', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b', font: {size: 10} }, grid: {display: false} }, y: { ticks: { color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b', stepSize: 1 }, grid: {color: document.documentElement.classList.contains('dark') ? '#334155' : '#e2e8f0'} } } } });

                data.history.forEach(item => {
                    const tr = document.createElement('tr'); tr.className = "border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-800/50";
                    tr.innerHTML = `<td class="px-4 py-3 whitespace-nowrap text-[10px] text-slate-500">${new Date(item.created_at).toLocaleString('vi-VN', {hour: '2-digit', minute:'2-digit', day: '2-digit', month: '2-digit'})}</td><td class="px-4 py-3 truncate max-w-[120px] text-slate-700 dark:text-slate-300 font-medium" title="${item.prompt}">${item.prompt}</td><td class="px-4 py-3 font-bold ${item.total_score >= 7 ? 'text-green-500' : (item.total_score >= 5 ? 'text-yellow-500' : 'text-red-500')}">${item.total_score}</td><td class="px-4 py-3">${item.errors && item.errors.length > 0 ? item.errors.slice(0, 3).map(e => `<span class="inline-block bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 px-1.5 py-0.5 rounded text-[10px] font-semibold mr-1 mb-1 border border-red-200">${e.code}</span>`).join('') : `<span class="inline-block bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400 px-2 py-0.5 rounded text-[10px] font-semibold border border-green-200">Sạch</span>`}</td>`;
                    tbody.appendChild(tr);
                });
            }
        } catch (e) { tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500 text-xs">Lỗi tải dữ liệu.</td></tr>'; }
    }
</script>
</body>
</html>
